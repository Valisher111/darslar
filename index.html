<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darslar</title>
<meta name="theme-color" content="#0b7a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darslar">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7a5f'/%3E%3Cpath d='M18 16h14a16 16 0 0 1 0 32H18z' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --panel:#ffffff; --ink:#14201c; --muted:#5d6d67; --line:#e2e8e5; --soft:#f7faf9;
  --accent:#0b7a5f; --accent-2:#10a37f; --accent-ink:#ffffff; --accent-soft:#e3f4ee;
  --side:#0d2b23; --side-ink:#cfe5dd; --side-muted:#86a89c; --side-on:#16483a;
  --good:#16865a; --warn:#b26a00; --warn-soft:#fff3dd; --bad:#c43a3a; --bad-soft:#fdeceb;
  --changed:#fff5d1; --ro:#f1f4f3;
  --r:14px; --tap:44px; --shadow:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1513; --panel:#151f1c; --ink:#e4efeb; --muted:#93a8a0; --line:#24332e; --soft:#1a2622;
    --accent:#34c79c; --accent-2:#5fd8b2; --accent-ink:#06231a; --accent-soft:#173a30;
    --side:#0a1210; --side-ink:#cfe5dd; --side-muted:#7e978e; --side-on:#173a30;
    --good:#4ccf94; --warn:#e6a940; --warn-soft:#3a2d14; --bad:#ff7b7b; --bad-soft:#3b1f1f;
    --changed:#3b3416; --ro:#1b2622; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:18px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent-2);display:grid;place-items:center;color:#06231a;font-weight:800}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--side-muted)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;min-height:var(--tap);cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:var(--side-on);color:#fff;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;opacity:.9}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:20px;margin:0;margin-right:auto}
.menu-btn{display:none;border:0;background:none;width:var(--tap);height:var(--tap);border-radius:10px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;white-space:nowrap;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.content{padding:24px;max-width:1180px;width:100%;margin:0 auto;padding-bottom:110px}
.overlay{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  body.drawer aside{transform:none}
  body.drawer .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .menu-btn{display:grid;place-items:center}
  .topbar{padding:10px 16px}
  .topbar .chips{order:3;width:100%}
  .content{padding:16px 16px 110px}
}

/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-title h2{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;min-height:var(--tap);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 16px;min-height:38px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--ro);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;min-height:var(--tap)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.loading{padding:50px;text-align:center;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* today */
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero .date{font-size:26px;font-weight:700;letter-spacing:-.01em}
.lesson-card{border-left:4px solid var(--accent)}
.lesson-card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gbadge{font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 9px;font-size:14px}
.progress{height:8px;background:var(--ro);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent-2);border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0 12px}
.kv b{color:var(--muted);font-weight:500}
.up{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.up:last-child{border-bottom:0}
.up .d{min-width:52px;font-weight:700}
.gcard{cursor:pointer;transition:border-color .15s}
.gcard:hover{border-color:var(--accent)}
.gcard .big{font-size:30px;font-weight:700;line-height:1.1}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}

/* grades */
.dlist{list-style:none;margin:0;padding:0}
.dlist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dlist li:last-child{border-bottom:0}
.dlist .nm{flex:1;min-width:0}
.dlist .no{color:var(--muted);min-width:26px}
.mark{width:72px;text-align:center;min-height:var(--tap);border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600}
.mark.changed{background:var(--changed)}
.mark.nb{color:var(--bad)}
.mark.bad{outline:2px solid var(--bad)}
.quick{display:flex;gap:4px}
.quick button{min-width:40px}
.tablewrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px}
table.g th,table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--soft);z-index:2;font-weight:600}
table.g .st{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;max-width:210px;overflow:hidden;text-overflow:ellipsis}
table.g thead .st{z-index:3;background:var(--soft)}
table.g td.ro{background:var(--ro);color:var(--muted)}
table.g td.ed{cursor:pointer}
table.g td.ed:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.g td.nbv{color:var(--bad);font-weight:700}
table.g td.hl{background:var(--changed)}
.lrow{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.lrow .dt{min-width:58px;font-weight:700}
.lrow .dt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lrow.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lrow.past{opacity:.92}
.lrow .lt{line-height:1.35}
.lrow .lf{margin:4px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow .ls{flex:none;max-width:40%;text-align:right}
.lrow .lq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
@media (max-width:640px){.lrow{flex-wrap:wrap}.lrow .ls{max-width:none;width:100%;text-align:left;order:3}}
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.slist li:hover{background:var(--accent-soft)}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}

/* misc */
.savebar{position:fixed;left:248px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:30}
@media (max-width:900px){.savebar{left:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:90;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);width:100%;max-width:560px;border-radius:16px;padding:20px;max-height:90vh;overflow:auto}
.modal.pmodal{max-width:440px;padding:14px 16px}

/* ---- live game host (projector) ---- */
#lv{position:fixed;inset:0;z-index:300;background:#0e3b2e;color:#fff;display:flex;flex-direction:column;font-size:18px;overflow:auto}
#lv .lv-top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(0,0,0,.25);flex-wrap:wrap}
#lv .lv-dim{color:#a9cfc1}
#lv .lv-pill{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px;font-weight:700}
#lv .lv-main{flex:1;display:flex;flex-direction:column;padding:24px clamp(16px,4vw,56px);gap:22px;min-height:0}
#lv .lv-btn{background:#fff;color:#0e3b2e;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer}
#lv .lv-btn.ghost{background:rgba(255,255,255,.12);color:#fff;padding:8px 14px;font-weight:600}
#lv .lv-btn.big{font-size:26px;padding:16px 44px}
#lv .lv-btn:disabled{opacity:.4;cursor:default}
#lv .lv-mus{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 24px;background:rgba(0,0,0,.18)}
#lv .lv-btn.ghost.on{background:#fff;color:#0e3b2e}
#lv .lv-h1{font-size:clamp(26px,3.2vw,44px);font-weight:800;line-height:1.15;text-align:center;margin:0}
#lv .lv-key{background:#fff;color:#0e3b2e;border-radius:10px;padding:0 12px;white-space:nowrap}
#lv .lv-count{text-align:center;font-size:22px}#lv .lv-count b{font-size:64px;display:block;line-height:1}
#lv .lv-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;flex:1}
#lv .lv-chip{background:#fff;color:#0e3b2e;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;font-size:22px;cursor:pointer}
#lv .lv-chip:hover{text-decoration:line-through;background:#ffd5d5}
#lv .lv-center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#lv .lv-prompt{font-size:clamp(26px,3.4vw,50px);font-weight:800;text-align:center;background:#fff;color:#111;border-radius:16px;padding:22px 28px;line-height:1.2}
#lv .lv-mid{display:flex;align-items:center;justify-content:space-between;flex:1;min-height:110px;gap:16px}
#lv .lv-timer{width:130px;height:130px;border-radius:50%;background:#6d28d9;display:grid;place-items:center;font-size:60px;font-weight:800}
#lv .lv-ans{text-align:center;font-size:22px}#lv .lv-ans b{font-size:60px;display:block;line-height:1}
#lv .lv-expl{flex:1;text-align:center;font-size:clamp(18px,2vw,28px);color:#e6f4ee}
#lv .lv-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#lv .lv-opt{display:flex;align-items:center;gap:16px;border-radius:12px;padding:18px 22px;font-size:clamp(20px,2.3vw,34px);font-weight:800;min-height:96px;color:#fff;transition:opacity .3s}
#lv .lv-opt.dim{opacity:.28}
#lv .lv-shape{font-size:1.15em;width:1.3em;text-align:center;flex:none}
#lv .lv-cnt{font-size:1.1em;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 14px}
#lv .lv-board{max-width:860px;width:100%;margin:0 auto;display:grid;gap:12px}
#lv .lv-row{display:flex;align-items:center;gap:18px;background:#fff;color:#111;border-radius:12px;padding:14px 22px;font-size:clamp(22px,2.4vw,32px);font-weight:800}
#lv .lv-row .n{width:44px;color:#6b7280}#lv .lv-row .s{margin-left:auto}
#lv .lv-pod{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,26px);flex:1;min-height:320px}
#lv .lv-pod .col{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(26vw,280px)}
#lv .lv-pod .nm{font-size:clamp(22px,2.6vw,36px);font-weight:800;text-align:center;word-break:break-word}
#lv .lv-pod .bar{width:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-size:44px;font-weight:800}
#lv .lv-note{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;font-size:16px;max-width:860px;margin:0 auto;width:100%}
#lv .lv-lobby{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:28px;flex:1;min-height:0}
#lv .lv-qrbox{background:#fff;color:#0e3b2e;border-radius:18px;padding:20px;text-align:center;align-self:start}
#lv .lv-qrbox .lv-qr{display:flex;justify-content:center;margin:6px 0 12px}
#lv .lv-qrbox .lv-qr img,#lv .lv-qrbox .lv-qr canvas{width:100%!important;max-width:280px;height:auto!important}
#lv .lv-qrbox b{font-size:24px;display:block}
#lv .lv-qrbox small{display:block;color:#4b5563;font-size:14px;margin-top:6px;line-height:1.35}
#lv .lv-right{display:flex;flex-direction:column;gap:18px;min-height:0}
#lv .lv-chip.g{background:#fde68a}
.modal-bg.top{z-index:400}
#lv .lv-racehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#lv .lv-pill.big{font-size:26px;padding:6px 18px}
#lv .lv-racebox{position:relative;flex:1;min-height:200px;overflow-y:auto;overflow-x:hidden;background:rgba(0,0,0,.18);border-radius:16px;padding:8px 0}
#lv .rl{display:grid;grid-template-columns:140px 1fr 150px;align-items:center;height:var(--lh,38px);padding:0 10px;font-size:clamp(12px,calc(var(--lh,38px)*.42),20px);font-weight:700;border-radius:8px}
#lv .rl .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
#lv .rl .rt{position:relative;height:70%;border-bottom:2px dashed rgba(255,255,255,.2)}
#lv .rl .rr{position:absolute;bottom:-2px;transform:translateX(-50%);transition:left .6s ease;font-size:1.35em;line-height:1}
#lv .rl .rs{text-align:right;color:#cfe9df;font-size:.85em;white-space:nowrap}
#lv .rl.caught{background:rgba(226,27,60,.28)} #lv .rl.done .rs{color:#86efac}
#lv .lv-robot{position:absolute;top:0;bottom:0;width:4px;background:rgba(226,27,60,.9);box-shadow:0 0 22px #e21b3c;transition:left .3s linear;pointer-events:none;z-index:2}
#lv .lv-robot span{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:40px;filter:drop-shadow(0 0 6px #e21b3c)}
#lv .lv-finish{position:absolute;top:0;bottom:0;right:156px;border-left:4px dotted rgba(255,255,255,.55);pointer-events:none}
#lv .lv-chip .av{margin-right:8px}
#lv .rl .rn .td,#lv .lv-tdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
#lv .lv-row .av{font-size:1.1em}
#lv .lv-row.team{color:#fff;border-left:0}
#lv .lv-row .meta{font-size:.6em;font-weight:600;opacity:.85}
#lv .lv-tchips{display:flex;gap:8px;flex-wrap:wrap}
#lv .lv-tchips span{border-radius:99px;padding:4px 12px;font-weight:800;font-size:15px}
#lv .rr-msg{font-size:18px;flex:1;min-width:0}
#lv .rr-run{position:relative;flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;min-height:0}
#lv .rr-track{position:relative;height:clamp(120px,24vh,200px);background:linear-gradient(180deg,#22305a,#121a33 70%,#0b1124);border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.15)}
#lv .rr-track:after{content:"";position:absolute;left:0;right:0;bottom:12px;border-bottom:3px dashed rgba(255,255,255,.18)}
#lv .rr-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(38,137,12,0),rgba(38,137,12,.35));transition:width .5s}
#lv .rr-crew{position:absolute;bottom:16px;transform:translateX(-100%);display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;max-width:300px;gap:0 2px;font-size:clamp(22px,3vw,36px);line-height:1.05;transition:left .5s ease;z-index:2}
#lv .rr-crew i{font-style:normal;animation:rrhop .45s ease-in-out infinite alternate}
#lv .rr-crew i:nth-child(2n){animation-delay:.2s}
@keyframes rrhop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
#lv .rr-bot{position:absolute;bottom:10px;transform:translateX(-100%);font-size:clamp(56px,8vw,96px);line-height:1;transition:left .3s linear;filter:drop-shadow(0 0 14px #e21b3c);z-index:3}
#lv .rr-bot.near{animation:rrshake .25s infinite}
@keyframes rrshake{0%,100%{margin-left:0}50%{margin-left:6px}}
#lv .rr-door{position:absolute;right:10px;top:10px;bottom:10px;width:clamp(70px,9%,110px);background:rgba(38,137,12,.55);border:3px solid #4ade80;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px}
#lv .rr-door small{font-size:12px;font-weight:900;text-align:center;line-height:1.1}
#lv .rr-goal{font-size:clamp(22px,3vw,34px);font-weight:800;text-align:center}
#lv .rr-warn{display:block;font-size:.6em;color:#fca5a5;animation:lvpop .4s both}
#lv .rr-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:30vh;overflow:auto}
#lv .rr-chips span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-weight:700;font-size:16px}
#lv .rr-chips em{font-style:normal;color:#facc15}
#lv .rr-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(34px,5.5vw,70px);font-weight:900;background:rgba(0,0,0,.6);border-radius:18px;text-align:center;z-index:6;animation:lvpop .4s both;padding:20px}
#lv .rr-over.bad{color:#fca5a5} #lv .rr-over.ok{color:#86efac}
#lv .rr-over small{font-size:.42em;color:#fff;font-weight:700;margin-top:12px}
#lv .rr-zbar{height:12px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;flex:none}
#lv .rr-zbar i{display:block;height:100%;width:100%;background:#1368ce;transition:width .25s linear}
#lv .rr-mapw{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#lv .rr-map{position:relative;aspect-ratio:10/6;width:min(100%,calc((100vh - 220px) * 10 / 6));background-color:#16203a;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:10% 16.6667%;border-radius:16px;border:2px solid rgba(255,255,255,.18);overflow:hidden}
#lv .rr-z{position:absolute;background:rgba(38,137,12,.42);border:3px solid #4ade80;border-radius:10px;display:flex;align-items:flex-start;justify-content:space-between;padding:4px 8px;font-weight:900;font-size:clamp(14px,1.8vw,24px);box-sizing:border-box}
#lv .rr-z.full{border-color:#facc15;background:rgba(216,158,0,.35)} #lv .rr-z.over{background:rgba(226,27,60,.5);border-color:#f87171}
#lv .rr-cell{position:absolute;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 2px;font-size:clamp(14px,2vw,30px);line-height:1;z-index:2;pointer-events:none}
#lv .rr-cell i{font-style:normal;display:flex;flex-direction:column;align-items:center}
#lv .rr-cell small{font-size:11px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5e7eb;font-weight:700}
#lv .rr-cell em{font-style:normal;font-size:12px;font-weight:800}
#lv .rr-aw{text-align:center}
#lv .rr-awl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
#lv .rr-awl span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px}
.lv-float{position:fixed;bottom:30px;font-size:48px;z-index:400;pointer-events:none;animation:lvfloat 3.2s ease-out forwards}
@keyframes lvfloat{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-62vh) scale(1);opacity:0}}
#lv .lv-pod .bar{transform-origin:bottom;animation:lvgrow .9s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--d) - var(--el,0s))}
#lv .lv-pod .nm,#lv .lv-pod .sub{animation:lvpop .5s both;animation-delay:calc(var(--d) + .75s - var(--el,0s))}
#lv .lv-pod .av{font-size:clamp(34px,min(4.5vw,7vh),68px);line-height:1}
#lv .lv-pod .col{gap:6px}
@keyframes lvgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes lvpop{from{opacity:0;transform:translateY(24px) scale(.7)}to{opacity:1;transform:none}}
.lv-conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:301}
.lv-conf i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:lvconf 3.4s linear both;animation-delay:calc(var(--d) - var(--el,0s))}
@keyframes lvconf{from{transform:translateY(0) rotate(0)}to{transform:translateY(112vh) rotate(800deg)}}
#lv .lv-best{text-align:center;font-size:20px;animation:lvpop .5s both;animation-delay:calc(4.4s - var(--el,0s))}
#lv .lv-mission{max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#lv .lv-mtrack{position:relative;height:70px;background:rgba(0,0,0,.28);border-radius:35px;overflow:hidden}
#lv .lv-mfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6d28d9,#1368ce,#26890c);transition:width 1.2s ease}
#lv .lv-mrocket{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);font-size:46px;transition:left 1.2s ease}
#lv .lv-mgoal{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:42px}
#lv .lv-mtxt{display:flex;justify-content:space-between;gap:12px;font-size:22px;font-weight:700;flex-wrap:wrap}
#lv .lv-fbk{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.rep{width:100%;border-collapse:collapse;font-size:14px}.rep th,.rep td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.rep th{font-size:12px;color:var(--muted);font-weight:600}.rep td.n{text-align:right;white-space:nowrap}
.modal.wide{max-width:900px}
.qe-list{display:grid;gap:12px}
.qe{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.qe.err{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.qe-err{color:var(--bad);margin-top:6px}
.qe-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.qe-h b{min-width:26px}
.qe-h select{width:auto;min-height:36px;padding:4px 8px}
.qe-ib{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-width:34px;min-height:34px;cursor:pointer;flex:none}
.qe-ib:disabled{opacity:.35;cursor:default}
.qe-ib.bad{color:var(--bad)}
.qe-p{min-height:0;resize:vertical}
.qe-lab{font-size:13px;color:var(--muted);margin:10px 0 2px}
.qe-row{display:flex;gap:6px;align-items:center;margin-top:6px;border-radius:10px}
.qe-row input[type=text]{min-height:38px;padding:6px 10px;flex:1;min-width:0}
.qe-row input[type=radio]{width:20px;height:20px;flex:none;accent-color:var(--accent);margin:0 4px}
.qe-row.ok input[type=text]{border-color:var(--accent);background:var(--accent-soft)}
.qe-n{width:22px;text-align:center;color:var(--muted);flex:none}
.qe-add{margin-top:8px}
.qe-x{margin-top:10px;min-height:38px;padding:6px 10px;font-size:14px}
.qe-tf button{min-width:90px}
.qe-tf button.on{background:var(--accent);color:var(--accent-ink)}
.qe-addbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 6px}
.qe-foot{position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 4px;border-top:1px solid var(--line);margin-top:8px}
@media (max-width:560px){.qe-h select{max-width:150px}.qe-addbar .btn{flex:1 1 45%}}
@media (max-width:800px){#lv .lv-lobby{grid-template-columns:1fr}}
@media (max-width:700px){#lv .lv-opts{grid-template-columns:1fr}#lv .lv-timer{width:90px;height:90px;font-size:40px}}
.phone{margin:0 auto;width:min(390px,100%);height:min(760px,calc(90vh - 110px));border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.phone iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:600px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0}}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--side) 0%,#0b3a2e 55%,var(--bg) 55.1%)}
.auth .card{width:100%;max-width:400px;padding:28px}
.auth .logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:14px}
.check{display:flex;align-items:center;gap:8px;margin:4px 0 16px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="auth hidden">
  <div class="card">
    <div class="logo">D</div>
    <h2 id="auth-title" style="font-size:22px;margin-bottom:4px">Darslar</h2>
    <p class="muted" id="auth-sub" style="margin-top:0">Teacher dashboard · V.A. Tangriyev</p>
    <form id="auth-form" autocomplete="on">
      <input type="text" name="username" value="teacher" autocomplete="username" class="hidden" readonly>
      <label class="f"><span>Password</span><input type="password" id="pw1" autocomplete="current-password" required></label>
      <label class="f hidden" id="pw2-wrap"><span>Repeat password</span><input type="password" id="pw2" autocomplete="new-password"></label>
      <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
      <button class="btn primary" style="width:100%" id="auth-btn">Sign in</button>
      <p class="small muted" id="auth-msg" style="margin-bottom:0"></p>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <aside>
    <div class="brand"><div class="logo">D</div><div>Darslar<small>2026–2027 · DTPI</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="title">Today</h1>
      <div class="chips" id="chips"></div>
    </div>
    <div class="content" id="view"><div class="loading">Loading…</div></div>
  </div>
</div>
<div class="savebar hidden" id="savebar">
  <span id="savecount" class="muted"></span><span class="spacer"></span>
  <button class="btn" id="discard">Discard</button>
  <button class="btn primary" id="saveall">Save changes</button>
</div>

  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer);

/* ===================== API ===================== */
let KEY = store.get('dp_key');
async function api(action, ...args) {
  const r = await apiFetch(JSON.stringify({ action, key: KEY, args }));
  if (!r.ok) throw new Error('Server error ' + r.status);
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { signOut(true); throw new Error('Please sign in again.'); }
    throw new Error(j.error);

function buildNav() {
  $('#nav').innerHTML = PAGES.map(([id, label]) =>
    `<a data-p="${id}" href="#/${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${label}</a>`).join('');
}
function go(page, group) {
  if (group) S.group = group;
  location.hash = '#/' + page + (GROUP_PAGES.includes(page) && S.group ? '/' + S.group : '');
}
window.addEventListener('hashchange', () => { if (KEY) route(); });
function route() {
  if (Object.keys(S.pending).length && !confirm(Object.keys(S.pending).length + ' unsaved change(s) will be lost. Continue?')) return;
  S.pending = {}; updateSavebar(); S.navId = (S.navId || 0) + 1; stopQuizTimer();
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  S.page = PAGES.some(p => p[0] === parts[0]) ? parts[0] : 'today';
  if (parts[1] && S.groups.includes(parts[1])) S.group = parts[1];
  store.set('dp_group', S.group, true);
  document.body.classList.remove('drawer');
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === S.page));
  $('#title').textContent = PAGES.find(p => p[0] === S.page)[1];
  renderChips();
  ({ today: pageToday, grades: pageGrades, lessons: pageLessons, students: pageStudents,
     deadlines: pageDeadlines, quizzes: pageQuizzes, settings: pageSettings })[S.page]();
}
function renderChips() {
  const show = GROUP_PAGES.includes(S.page);
  $('#chips').innerHTML = show ? S.groups.map(g =>
    `<button class="chip ${g === S.group ? 'on' : ''}" data-g="${esc(g)}" title="${esc(S.subjects[g] || '')}">${esc(g)}</button>`).join('') : '';
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) go(S.page, b.dataset.g); });
$('#menu-btn').onclick = () => document.body.classList.add('drawer');
$('#overlay').onclick = () => document.body.classList.remove('drawer');

function getGroup(force) {
  if (S.data[S.group] && !force) return Promise.resolve(S.data[S.group]);
  return api('group', S.group).then(d => (S.data[d.group] = d));
}

/* ===================== pending + save ===================== */
const colOf = c => S.data[S.group].cols[c - 1];
const editable = c => c.kind === 'day' || c.kind === 'manual' || c.kind === 'team';
function validMark(col, v) {
  v = String(v).trim(); if (v === '') return true;
  if (col.kind === 'team') return v.length <= 30;
  if (col.kind === 'day' && v.toLowerCase() === 'nb') return true;
  const n = Number(v.replace(',', '.')); return isFinite(n) && n >= 0 && n <= col.max;
}
function setPending(row, col, value) {
  const st = S.data[S.group].students.find(s => s.row === row);
  const key = row + ':' + col; value = String(value).trim();
  if (value === String(st.v[col - 1] || '')) delete S.pending[key]; else S.pending[key] = { row, col, value };
  updateSavebar();
}
function pv(row, col) {
  const p = S.pending[row + ':' + col]; if (p) return p.value;
  return S.data[S.group].students.find(s => s.row === row).v[col - 1] || '';
}
function updateSavebar() {
  const n = Object.keys(S.pending).length;
  $('#savebar').classList.toggle('hidden', !n);
  $('#savecount').textContent = n + ' unsaved change' + (n === 1 ? '' : 's');
}
$('#discard').onclick = () => { S.pending = {}; updateSavebar(); route(); };
$('#saveall').onclick = async () => {
  const entries = Object.values(S.pending);
  const bad = entries.find(e => !validMark(colOf(e.col), e.value));
  if (bad) return toast('Not allowed: "' + bad.value + '". Use 0–' + colOf(bad.col).max + ' or nb.', true);
  $('#saveall').disabled = true;
  try {
    const rows = await api('save', S.group, entries);
    const d = S.data[S.group];
    Object.keys(rows).forEach(r => { const st = d.students.find(s => s.row === +r); if (st) st.v = rows[r]; });
    S.pending = {}; updateSavebar(); toast('Saved ' + entries.length + ' change' + (entries.length === 1 ? '' : 's') + ' to the gradebook');
    route();
  } catch (e) { fail(e); } finally { $('#saveall').disabled = false; }
};

    const upHtml = h.upcoming.length ? h.upcoming.map(u => `<div class="up">

    const dlHtml = h.deadlines.length ? h.deadlines.map(x => {
      const p = x.days < 0 ? `<span class="pill gray">${-x.days} d ago</span>` : x.days === 0 ? '<span class="pill bad">today</span>' : x.days <= 3 ? `<span class="pill warn">in ${x.days} d</span>` : `<span class="pill">in ${x.days} d</span>`;
      return `<div class="up"><span class="gbadge">${esc(x.group)}</span><div style="flex:1;min-width:0"><div>${esc(x.title)}</div><div class="small muted">${esc(md(x.due_date))} · ${esc(x.type)}</div></div>${p}</div>`;
    }).join('') : '<div class="empty">No deadlines in the next 30 days.</div>';
    const gHtml = h.groups.map(g => {
      const pct = g.lessonsTotal ? Math.round(g.lessonsDone / g.lessonsTotal * 100) : 0;
      return `<div class="card gcard" data-g="${esc(g.group)}">
        <div class="row"><span class="gbadge">${esc(g.group)}</span><span class="small muted" style="flex:1">${esc(g.subject)}</span></div>

          <div><b style="font-size:18px">${g.students}</b><div class="small muted">students</div></div>

/* ===================== GRADES ===================== */
async function pageGrades() {
  loading();
  try {
    const my = S.navId; const d = await getGroup(); if (my !== S.navId) return;
    const days = d.cols.filter(c => c.kind === 'day');
    if (!S.day[S.group]) {
      const past = days.filter(c => ddKey(c.h) <= ddKey(S.today));
      S.day[S.group] = (days.find(c => c.h === S.today) || past[past.length - 1] || days[0] || {}).c;
    }
    view().innerHTML = `
      <div class="row" style="margin-bottom:14px">
        <div><div class="small muted">${esc(S.subjects[S.group] || '')}</div><b style="font-size:17px">Group ${esc(S.group)} · ${d.students.length} students</b></div>
        <span class="spacer"></span>
        <div class="seg"><button data-v="day" class="${S.view === 'day' ? 'on' : ''}">Day</button><button data-v="table" class="${S.view === 'table' ? 'on' : ''}">Table</button></div>
        <button class="btn sm" id="reload" title="Reload from the gradebook">Refresh</button>
      </div><div id="gv"></div>`;
    $$('[data-v]').forEach(b => b.onclick = () => { S.view = b.dataset.v; pageGrades(); });
    $('#reload').onclick = () => { if (!Object.keys(S.pending).length || confirm('Discard unsaved changes?')) { S.pending = {}; updateSavebar(); getGroup(true).then(pageGrades).catch(fail); } };
    S.view === 'day' ? dayView(d, days) : tableView(d);
  } catch (e) { fail(e); }
}
function dayView(d, days) {
  const cn = S.day[S.group], col = d.cols[cn - 1];
  const vals = d.students.map(s => String(pv(s.row, cn)).trim());
  const nums = vals.filter(v => v && v.toLowerCase() !== 'nb').map(v => +v.replace(',', '.')).filter(isFinite);
  const nbs = vals.filter(v => v.toLowerCase() === 'nb').length;
  const avg = nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1) : '—';
  $('#gv').innerHTML = `
    <div class="grid g2" style="margin-bottom:14px">
      <div class="card"><label class="f" style="margin:0"><span>Lesson date</span><select id="daysel">${days.map((c, i) =>
        `<option value="${c.c}" ${c.c === cn ? 'selected' : ''}>${shortDay(c.h)}, ${esc(md(c.h))}${c.h === S.today ? ' · today' : ''} — lesson ${i + 1}, block ${c.block}</option>`).join('')}</select></label></div>
      <div class="card"><div class="grid g4" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><b>${nums.length + nbs}/${d.students.length}</b><span>marked</span></div>
        <div class="stat"><b>${avg}</b><span>average</span></div>
        <div class="stat"><b style="color:${nbs ? 'var(--bad)' : 'inherit'}">${nbs}</b><span>absent (nb)</span></div></div></div>
    </div>
    <div class="card"><div class="row small muted" style="margin-bottom:6px"><span>Type a mark 0–10, or tap nb. Then press Save.</span><span class="spacer"></span>
      <button class="btn sm" id="fillrest" title="Give every empty present student the same mark">Fill empty…</button></div>
      <ul class="dlist">${d.students.map(s => {
        const v = String(pv(s.row, cn)); const ch = S.pending[s.row + ':' + cn] ? ' changed' : ''; const nb = v.toLowerCase() === 'nb' ? ' nb' : '';
        return `<li><span class="no">${esc(s.no)}</span><div class="nm">${esc(s.name)}</div>
          <input class="mark${ch}${nb}" inputmode="decimal" data-row="${s.row}" value="${esc(v)}" aria-label="Mark for ${esc(s.name)}">
          <div class="quick"><button class="btn sm" data-q="${s.row}|10">10</button><button class="btn sm danger" data-q="${s.row}|nb">nb</button></div></li>`;
      }).join('')}</ul></div>`;
  $('#daysel').onchange = e => { S.day[S.group] = +e.target.value; pageGrades(); };
  const bind = inp => {
    setPending(+inp.dataset.row, cn, inp.value);
    inp.classList.toggle('changed', !!S.pending[inp.dataset.row + ':' + cn]);
    inp.classList.toggle('nb', inp.value.trim().toLowerCase() === 'nb');
    inp.classList.toggle('bad', !validMark(col, inp.value));
  };
  $$('#gv input.mark').forEach(inp => inp.oninput = () => bind(inp));
  $$('#gv [data-q]').forEach(b => b.onclick = () => {
    const [r, v] = b.dataset.q.split('|'); const inp = $(`#gv input.mark[data-row="${r}"]`);
    inp.value = inp.value.trim().toLowerCase() === v ? '' : v; bind(inp);
  });
  $('#fillrest').onclick = () => {
    const v = prompt('Mark for every student whose box is empty (0–10):', '8'); if (v == null) return;
    if (!validMark(col, v)) return toast('Use 0–10.', true);
    $$('#gv input.mark').forEach(inp => { if (!inp.value.trim()) { inp.value = v; bind(inp); } });
  };
}
function tableView(d) {
  const blocks = [[1, 'Block 1'], [2, 'Block 2'], [0, 'Final & independent work']];
  const cols = d.cols.filter(c => c.block === S.block && c.kind !== 'id' && c.kind !== 'empty');
  $('#gv').innerHTML = `
    <div class="row" style="margin-bottom:12px"><div class="seg">${blocks.map(b => `<button data-b="${b[0]}" class="${S.block === b[0] ? 'on' : ''}">${b[1]}</button>`).join('')}</div>
      <span class="small muted">Tap a white cell to edit. Grey cells are calculated by the gradebook.</span></div>
    <div class="tablewrap"><table class="g"><thead><tr><th class="st">Student</th>${cols.map(c => `<th title="${esc(c.section)}">${esc(md(c.h))}</th>`).join('')}</tr></thead>
    <tbody>${d.students.map(s => `<tr><td class="st" title="${esc(s.name)}">${esc(s.no)}. ${esc(s.name)}</td>${cols.map(c => {
      const v = String(pv(s.row, c.c));
      return `<td class="${editable(c) ? 'ed' : 'ro'} ${v.toLowerCase() === 'nb' ? 'nbv' : ''} ${S.pending[s.row + ':' + c.c] ? 'hl' : ''}" data-r="${s.row}" data-c="${c.c}">${esc(v)}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
  $$('#gv [data-b]').forEach(b => b.onclick = () => { S.block = +b.dataset.b; tableView(d); });
  $$('#gv td.ed').forEach(td => td.onclick = () => cellEditor(d, +td.dataset.r, +td.dataset.c, () => tableView(d)));
}
function cellEditor(d, row, cn, after) {
  const c = d.cols[cn - 1], st = d.students.find(s => s.row === row);
  const hint = c.kind === 'team' ? 'Team name or number' : '0–' + c.max + (c.kind === 'day' ? ' or nb' : '');
  modal(`<h3>${esc(st.name)}</h3><p class="muted small" style="margin-top:0">${esc(md(c.h))} · ${esc(c.section)}</p>
    <label class="f"><span>${hint}</span><input type="text" id="cv" inputmode="${c.kind === 'team' ? 'text' : 'decimal'}" value="${esc(pv(row, cn))}"></label>
    <div class="row">${c.kind === 'day' ? '<button class="btn danger" id="cnb">nb</button>' : ''}<button class="btn" id="cclr">Clear</button>
    <span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="cok">OK</button></div>`, m => {
    const inp = $('#cv', m); inp.focus(); inp.select();
    const ok = () => { if (!validMark(c, inp.value)) return toast('Not allowed: ' + inp.value + ' (' + hint + ')', true); setPending(row, cn, inp.value); closeModal(); after(); };
    $('#cok', m).onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
    $('#cclr', m).onclick = () => { inp.value = ''; ok(); };
    if ($('#cnb', m)) $('#cnb', m).onclick = () => { inp.value = 'nb'; ok(); };
  });
}

/* ===================== LESSONS ===================== */
async function pageLessons() {
  loading();
  try {
    const my = S.navId, g = S.group;
    await apiSWR('lessons', [g], list => { if (my !== S.navId) return; S.lessons = list; renderLessons(list); });
  } catch (e) { fail(e); }
}
function renderLessons(list) {
  const f = S.lessonFilter || 'all';
  const real = list.filter(l => !l.nocol);
  const done = real.filter(l => l.state === 'past' || l.state === 'today').length;
  const next = list.find(l => l.state === 'today') || list.find(l => l.state === 'next');
  const pct = real.length ? Math.round(done / real.length * 100) : 0;
  const shown = list.filter(l => f === 'all' || (f === 'next' ? l.state !== 'past' : l.state === 'past'));
  const status = l => {
    if (l.nocol) return '<span class="pill warn" title="The gradebook header for this lesson is not a dd.mm date">no gradebook column</span>';
    if (l.state === 'today') return '<span class="pill">Today</span>';
    if (l.state === 'next') return '<span class="pill gray">Upcoming</span>';
    if (!l.marked) return '<span class="pill warn">No marks</span>';
    return `<span class="pill gray">Marks ${l.marked}/${l.students}${l.avg != null ? ' · avg ' + l.avg : ''}${l.nb ? ' · nb ' + l.nb : ''}</span>`;
  };
  const quizRow = l => !l.quiz ? '' : `<div class="lq"><span class="small muted">Quiz (checks last lesson):</span> <b class="small">${esc(l.quiz.title)}</b>${l.quiz.status === 'closed' ? ' <span class="pill gray">closed</span>' : ''}
      ${l.state !== 'past' && l.quiz.status !== 'closed' ? `<span class="spacer"></span><button class="btn primary sm" data-live="${esc(l.quiz.quiz_id)}">▶ Live game</button><button class="btn sm" data-start="${esc(l.quiz.quiz_id)}">As test</button>` : ''}</div>`;
  const card = l => `<div class="card lrow ${l.state}" data-d="${esc(l.date)}">
      <div class="dt">${esc(md(l.date))}<small>${shortDay(l.date)} · #${l.n}</small></div>
      <div style="flex:1;min-width:0">
        <div class="lt">${l.unit ? '<span class="pill">' + esc(l.unit) + '</span> ' : ''}<b>${esc(l.topic) || '<span class="muted" style="font-weight:400">No topic yet — tap to add</span>'}</b></div>
        ${l.focus ? '<div class="lf small muted">' + esc(l.focus) + '</div>' : ''}
        ${l.done ? '<div class="small"><span class="muted">Done:</span> ' + esc(l.done) + '</div>' : ''}
        ${l.homework ? '<div class="small"><span class="muted">Homework:</span> ' + esc(l.homework) + '</div>' : ''}
        ${l.notes ? '<div class="small"><span class="muted">Notes:</span> ' + esc(l.notes) + '</div>' : ''}
        ${quizRow(l)}
      </div><div class="ls">${status(l)}</div></div>`;
  const blocks = [];
  shown.forEach(l => { const b = l.block || (blocks.length ? blocks[blocks.length - 1].b : 1); let x = blocks.find(z => z.b === b); if (!x) blocks.push(x = { b, items: [] }); x.items.push(l); });
  const blockHtml = blocks.map(x => {
    const all = list.filter(l => l.block === x.b);
    return `<div class="section-title" style="margin:18px 0 8px"><h2 style="margin:0">Block ${x.b}</h2><span class="small muted">${all.length ? esc(md(all[0].date)) + ' – ' + esc(md(all[all.length - 1].date)) + ' · ' + all.length + (all.length === 1 ? ' lesson' : ' lessons') : ''}</span></div>
      <div class="grid" style="gap:10px">${x.items.map(card).join('')}</div>`;
  }).join('');
  const chip = (k, t) => `<button class="btn sm ${f === k ? 'primary' : ''}" data-lf="${k}">${t}</button>`;
  view().innerHTML = `<div class="card" style="margin-bottom:6px">
      <div class="row" style="flex-wrap:wrap;gap:8px"><b style="flex:1;min-width:200px">${esc(S.subjects[S.group] || '')}</b>${chip('all', 'All')}${chip('next', 'Upcoming')}${chip('past', 'Past')}<button class="btn sm" id="ljump">Today</button></div>
      <div class="row small muted" style="margin:12px 0 6px"><span>${done} of ${real.length} lessons taught</span><span class="spacer"></span><span>${pct}%</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      ${next ? `<div class="small" style="margin-top:12px"><span class="muted">${next.state === 'today' ? 'Today' : 'Next lesson'}:</span> <b>${shortDay(next.date)}, ${esc(md(next.date))}</b> · ${esc(next.unit ? next.unit + ' · ' : '')}${esc(next.topic || 'topic not set')}${next.quiz ? ' · quiz: ' + esc(next.quiz.title) : ''}</div>` : ''}
    </div>
    ${blockHtml || '<div class="card empty">No lessons here.</div>'}`;
  $$('.lrow').forEach(el => el.onclick = e => { if (e.target.closest('button')) return; lessonEditor(list.find(l => l.date === el.dataset.d)); });
  $$('[data-lf]').forEach(b => b.onclick = () => { S.lessonFilter = b.dataset.lf; renderLessons(list); });
  $$('[data-live]').forEach(b => b.onclick = () => liveStartDialog(b.dataset.live));

function chart(series) {
  const pts = series.filter(s => s.raw !== '');
  if (!pts.length) return '<div class="muted">No marks yet.</div>';
  const W = Math.max(340, pts.length * 30), H = 190, L = 28, B = 30, T = 12;
  const x = i => L + 12 + i * ((W - L - 24) / Math.max(1, pts.length - 1)), y = v => T + (H - T - B) * (1 - v / 10);
  let path = '', area = '', grid = '';
  [0, 5, 10].forEach(v => grid += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`);
  const real = pts.map((p, i) => [p, i]).filter(([p]) => p.val != null);
  real.forEach(([p, i], k) => path += (k ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.val).toFixed(1));
  if (real.length) area = path + `L${x(real[real.length - 1][1]).toFixed(1)} ${y(0)}L${x(real[0][1]).toFixed(1)} ${y(0)}Z`;
  const dots = pts.map((p, i) => p.val == null
    ? `<text x="${x(i)}" y="${y(0) + 3}" text-anchor="middle" style="fill:var(--bad);font-weight:700;font-size:13px">×<title>${md(p.date)}: nb</title></text>`
    : `<circle cx="${x(i)}" cy="${y(p.val)}" r="4" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"><title>${md(p.date)}: ${p.raw}</title></circle>`).join('');
  const labels = pts.map((p, i) => i % 2 === 0 ? `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${md(p.date)}</text>` : '').join('');
  return `<div style="overflow-x:auto"><svg width="${W}" height="${H}" role="img" aria-label="Daily marks">${grid}<path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}${labels}</svg></div><div class="small muted">× = absent (nb)</div>`;
}

function qBody(q, showAnswer) {
  const ok = s => `<div class="small" style="color:var(--good);margin-top:4px">✓ ${esc(s)}</div>`;
  if (q.type === 'mc') return `<ol type="A" style="margin:6px 0 0;padding-left:22px">${q.options.map((o, i) => `<li style="${showAnswer && i === q.answer ? 'color:var(--good);font-weight:600' : ''}">${esc(o)}</li>`).join('')}</ol>`;
  if (q.type === 'tf') return showAnswer ? ok(q.answer ? 'True' : 'False') : '';
  if (q.type === 'gap') return showAnswer ? ok(q.accept.join(' / ')) : '';
  if (q.type === 'match') return `<div class="small" style="margin-top:4px">${q.pairs.map(p => `${esc(p[0])} → <b>${esc(p[1])}</b>`).join('<br>')}</div>`;
  if (q.type === 'order') return `<div class="small" style="margin-top:4px">${q.items.map((x, i) => `${i + 1}. ${esc(x)}`).join('<br>')}</div>`;
  return '';
}

      (q.options.length < 6 ? `<button class="btn sm qe-add" data-act="optadd">+ Option</button>` : '');
  }
  if (q.type === 'tf') body += `<div class="qe-lab">Right answer</div><div class="seg qe-tf"><button data-act="tf" data-v="1" class="${q.answer ? 'on' : ''}">True</button><button data-act="tf" data-v="0" class="${q.answer ? '' : 'on'}">False</button></div>`;
  if (q.type === 'gap') body += `<div class="qe-lab">Right answer</div><input type="text" data-k="gapans" value="${v(q.answer)}" placeholder="e.g. since">
    <div class="qe-lab">Also accept (optional, separate with commas)</div><input type="text" data-k="gapacc" value="${v(q.accept.join(', '))}" placeholder="e.g. sure, certain">
    <div class="small muted" style="margin-top:4px">Capital letters, spaces at the ends and the type of apostrophe do not matter.</div>`;
  if (q.type === 'match') body += `<div class="qe-lab">Pairs (left — right). Students see the right side mixed.</div>` + q.pairs.map((p, j) => `<div class="qe-row"><input type="text" data-k="pl" data-j="${j}" value="${v(p[0])}" placeholder="word"><span class="muted">—</span><input type="text" data-k="pr" data-j="${j}" value="${v(p[1])}" placeholder="meaning"><button class="qe-ib" data-act="pdel" data-j="${j}" ${q.pairs.length > 2 ? '' : 'disabled'} title="Remove">✕</button></div>`).join('') +
    (q.pairs.length < 8 ? `<button class="btn sm qe-add" data-act="padd">+ Pair</button>` : '');
  if (q.type === 'order') body += `<div class="qe-lab">Parts in the RIGHT order. Students see them mixed.</div>` + q.items.map((p, j) => `<div class="qe-row"><span class="qe-n">${j + 1}</span><input type="text" data-k="it" data-j="${j}" value="${v(p)}" placeholder="part ${j + 1}"><button class="qe-ib" data-act="iup" data-j="${j}" ${j ? '' : 'disabled'} title="Up">↑</button><button class="qe-ib" data-act="idel" data-j="${j}" ${q.items.length > 2 ? '' : 'disabled'} title="Remove">✕</button></div>`).join('') +
    (q.items.length < 10 ? `<button class="btn sm qe-add" data-act="iadd">+ Part</button>` : '');
  body += `<input type="text" class="qe-x" data-k="explain" value="${v(q.explain)}" placeholder="Rule / explanation shown after the quiz (optional)">`;
  return `<div class="qe" data-i="${i}">${head}${body}<div class="qe-err small"></div></div>`;
}
function quizEditor(q) {
  const Q = (q.questions || []).map(qeFromServer);
  let dirty = false;
  modal(`<h3>${q.quiz_id ? 'Edit quiz' : 'New quiz'} · group ${esc(q.group)}</h3>
    <label class="f"><span>Title (e.g. Unit 12 - The Cycle of Life)</span><input type="text" id="q_t" value="${esc(q.title || '')}"></label>
    <div class="row"><label class="f" style="flex:1"><span>Unit</span><input type="text" id="q_u" value="${esc(q.unit || '')}"></label>
      <label class="f" style="width:120px"><span>Minutes</span><input type="text" id="q_m" inputmode="numeric" value="${esc(q.duration_min || 10)}"></label></div>
    <div class="row" style="margin:4px 0 8px"><b>Questions</b><span class="small muted" id="q_sum"></span></div>
    <div class="qe-list" id="q_list"></div>
    <div class="qe-addbar"><span class="small muted">Add question:</span>${QE_TYPES.map(([k, l]) => `<button class="btn sm" data-new="${k}">+ ${l}</button>`).join('')}</div>
    <div class="row qe-foot"><span class="small muted" id="q_msg"></span><span class="spacer"></span><button class="btn" id="q_cancel">Cancel</button><button class="btn primary" id="q_ok">Save</button></div>`, m => {
    m.querySelector('.modal').classList.add('wide');
    const list = $('#q_list', m);
    const sum = () => { const c = {}; Q.forEach(x => c[x.type] = (c[x.type] || 0) + 1); $('#q_sum', m).textContent = Q.length ? `${Q.length} · ` + QE_TYPES.filter(([k]) => c[k]).map(([k, l]) => `${c[k]} ${l.toLowerCase()}`).join(', ') + (Q.some(x => x.type === 'mc' || x.type === 'tf') ? ` · Live game uses ${Q.filter(x => x.type === 'mc' || x.type === 'tf').length}` : '') : 'none yet'; };
    const draw = focusIdx => {
      list.innerHTML = Q.map((x, i) => qeCard(x, i, Q.length)).join('') || '<div class="card empty small">No questions yet. Use the buttons below.</div>';
      sum();
      if (focusIdx != null) { const c = list.querySelector(`.qe[data-i="${focusIdx}"]`); if (c) { c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); const p = c.querySelector('.qe-p'); if (p) p.focus(); } }
    };
    list.addEventListener('input', e => {
      const el = e.target, card = el.closest('.qe'); if (!card) return;
      const q = Q[+card.dataset.i], k = el.dataset.k, j = +el.dataset.j; dirty = true; card.classList.remove('err');
      if (k === 'prompt' || k === 'explain') q[k] = el.value;
      else if (k === 'opt') q.options[j] = el.value;
      else if (k === 'gapans') q.answer = el.value;
      else if (k === 'gapacc') q.accept = el.value.split(',').map(s => s.trim()).filter(Boolean);
      else if (k === 'pl') q.pairs[j][0] = el.value;
      else if (k === 'pr') q.pairs[j][1] = el.value;
      else if (k === 'it') q.items[j] = el.value;
    });
    list.addEventListener('change', e => {
      const el = e.target, card = el.closest('.qe'); if (!card) return;
      const i = +card.dataset.i; dirty = true;
      if (el.dataset.k === 'type') { Q[i] = qeConvert(Q[i], el.value); draw(); }
      if (el.dataset.k === 'answer') { Q[i].answer = +el.dataset.j; card.querySelectorAll('.qe-row').forEach((r, j) => r.classList.toggle('ok', j === Q[i].answer)); }
    });
    list.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const card = b.closest('.qe'), i = +card.dataset.i, q = Q[i], j = +b.dataset.j; dirty = true;
      switch (b.dataset.act) {
        case 'up': [Q[i - 1], Q[i]] = [Q[i], Q[i - 1]]; return draw();
        case 'down': [Q[i + 1], Q[i]] = [Q[i], Q[i + 1]]; return draw();
        case 'dup': { const c = JSON.parse(JSON.stringify(q)); delete c.id; Q.splice(i + 1, 0, c); return draw(i + 1); }
        case 'del': if (q.prompt.trim() && !confirm(`Delete question ${i + 1}?`)) return; Q.splice(i, 1); return draw();
        case 'optadd': q.options.push(''); return draw();
        case 'optdel': q.options.splice(j, 1); if (q.answer === j) q.answer = 0; else if (q.answer > j) q.answer--; return draw();
        case 'tf': q.answer = b.dataset.v === '1'; return draw();
        case 'padd': q.pairs.push(['', '']); return draw();
        case 'pdel': q.pairs.splice(j, 1); return draw();
        case 'iadd': q.items.push(''); return draw();
        case 'iup': [q.items[j - 1], q.items[j]] = [q.items[j], q.items[j - 1]]; return draw();
        case 'idel': q.items.splice(j, 1); return draw();
      }
    });
    m.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { Q.push(qeBlank(b.dataset.new)); dirty = true; draw(Q.length - 1); });
    const leave = () => { if (!dirty || confirm('Close without saving? Your changes will be lost.')) closeModal(); };
    $('#q_cancel', m).onclick = leave;
    m.addEventListener('click', e => { if (e.target === m) { e.stopImmediatePropagation(); leave(); } }, true);
    ['#q_t', '#q_u', '#q_m'].forEach(s => $(s, m).addEventListener('input', () => { dirty = true; }));
    $('#q_ok', m).onclick = async () => {
      const err = qeCheck(Q);
      list.querySelectorAll('.qe').forEach(c => { c.classList.remove('err'); c.querySelector('.qe-err').textContent = ''; });
      if (!$('#q_t', m).value.trim()) { $('#q_t', m).focus(); return fail('Write the quiz title.'); }
      if (err) {
        if (err[0] < 0) return fail(err[1]);
        const c = list.querySelector(`.qe[data-i="${err[0]}"]`); c.classList.add('err'); c.querySelector('.qe-err').textContent = err[1];
        c.scrollIntoView({ block: 'center', behavior: 'smooth' }); return fail(`Question ${err[0] + 1}: ${err[1]}`);
      }
      $('#q_ok', m).disabled = true; $('#q_msg', m).textContent = 'Saving…';
      try {
        await api('saveQuiz', { quiz_id: q.quiz_id || '', group: q.group, title: $('#q_t', m).value.trim(), unit: $('#q_u', m).value.trim(), duration_min: $('#q_m', m).value.trim(), questions: qeOut(Q), status: 'ready' });
        closeModal(); toast('Quiz saved'); pageQuizzes();
      } catch (e) { $('#q_ok', m).disabled = false; $('#q_msg', m).textContent = ''; fail(e); }
    };
    draw();
  });
}
function copyDialog(id) {
  modal(`<h3>Copy quiz to another group</h3><label class="f"><span>Group</span><select id="cg">${S.groups.map(g => `<option ${g === S.group ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>
    <div class="row"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="cok">Copy</button></div>`, m => {
    $('#cok', m).onclick = async () => { try { const g = $('#cg', m).value; await api('copyQuiz', id, g); closeModal(); toast('Copied to ' + g); go('quizzes', g); if (g === S.group) pageQuizzes(); } catch (e) { fail(e); } };
  });
}
async function startDialog(id) {
  let c;
  try { c = await api('startCheck', id); } catch (e) { return fail(e); }
  const info = c => !c.dateOk ? `<p class="pill bad" style="display:block;padding:8px 10px;border-radius:10px">There is no column ${esc(c.date ? md(c.date) : 'for today')} in the gradebook. Choose the lesson date, or marks will not be written.</p>`
    : c.filled ? `<p class="pill warn" style="display:block;padding:8px 10px;border-radius:10px">${c.filled} of ${c.students} students already have a mark on ${esc(md(c.date))}. Their quiz marks will not replace it — you will see a warning and can choose.</p>`
    : `<p class="small muted">Marks will go to the column <b>${esc(md(c.date))}</b> (all ${c.students} cells are empty).</p>`;
  modal(`<h3>Start quiz</h3>
    ${c.otherOpen.length ? `<p class="pill bad" style="display:block;padding:8px 10px;border-radius:10px">Another quiz is open (group ${esc(c.otherOpen.join(', '))}). Close it first.</p>` : ''}
    <div class="row"><label class="f" style="flex:1"><span>Lesson date (gradebook column)</span><select id="sd"><option value="">— choose —</option>${c.dates.map(d => `<option value="${esc(d)}" ${d === c.date ? 'selected' : ''}>${esc(md(d))}</option>`).join('')}</select></label>
      <label class="f" style="width:120px"><span>Minutes</span><input type="text" id="sm" inputmode="numeric" value="10"></label></div>
    <div id="sinfo">${info(c)}</div>
    <p class="small muted">The timer starts now for everyone. Each student has one attempt. Students see the quiz on their page; press “Notify students” after starting to send a Telegram message.</p>
    <div class="row"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="sgo">Start now</button></div>`, async m => {
    try { const q = await api('quiz', id); $('#sm', m).value = q.duration_min; } catch (e) {}
    $('#sd', m).onchange = async e => { try { $('#sinfo', m).innerHTML = info(await api('startCheck', id, e.target.value)); } catch (er) { fail(er); } };
    $('#sgo', m).onclick = async () => {
      if (!$('#sd', m).value && !confirm('No lesson date chosen: marks will not be written to the gradebook. Start anyway?')) return;
      $('#sgo', m).disabled = true;
      try { const res = await api('startQuiz', id, $('#sm', m).value, $('#sd', m).value); closeModal(); toast('Quiz started'); quizLive(id, res); }
      catch (e) { $('#sgo', m).disabled = false; fail(e); }
    };
  });
}
async function quizLive(id, res) {
  stopQuizTimer();
  const my = S.navId;
  if (!res) { loading(); try { res = await api('quizResults', id); } catch (e) { return fail(e); } }
  if (my !== S.navId) return;
  const off = Date.parse(res.now) - Date.now();
  const q = res.quiz, isOpen = q.status === 'open';
  const nbCand = res.rows.filter(r => r.state === 'not started' && r.cell === '');
  const st = r => r.state === 'done' ? (r.written ? '<span class="pill">in gradebook</span>'
      : /conflict/.test(r.note) ? `<span class="pill warn">cell has ${esc((r.note.match(/has ([^;]+)/) || [])[1] || '?')}</span> <button class="btn sm" data-use="${esc(r.name)}">Use quiz mark</button>`
      : `<span class="pill bad">${esc(r.note || 'not written')}</span>`)
    : r.state === 'working' ? '<span class="pill warn">working…</span>' : `<span class="pill gray">not started</span>${r.cell ? ' <span class="small muted">(' + esc(r.cell) + ')</span>' : ''}`;
  view().innerHTML = `<div class="row" style="margin-bottom:14px"><button class="btn sm" id="qback">← Quizzes</button></div>
    <div class="card"><div class="row"><span class="gbadge">${esc(q.group)}</span><b style="flex:1;min-width:0;font-size:17px">${esc(q.title)}</b><span class="pill ${QPILL[q.status]}">${esc(q.status)}</span></div>
      <div class="grid g4" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        <div class="stat"><b id="qleft">${isOpen ? '—' : 'closed'}</b><span>time left</span></div>
        <div class="stat"><b>${res.done}/${res.students}</b><span>finished</span></div>
        <div class="stat"><b>${res.avg == null ? '—' : res.avg}</b><span>average /10</span></div>
        <div class="stat"><b>${esc(md(q.lesson_date) || '—')}</b><span>${res.dateOk ? 'gradebook column' : '<span style="color:var(--bad)">no column</span>'}</span></div></div>
      ${isOpen ? `<div class="row" style="margin-top:14px"><button class="btn" id="qnot">Notify students</button><button class="btn" id="qext">+2 min</button><span class="spacer"></span><button class="btn danger" id="qclose">Close now</button></div>` : ''}
      ${!isOpen && nbCand.length && res.dateOk ? `<div class="row" style="margin-top:14px"><span class="small muted" style="flex:1">${nbCand.length} did not take it and have no mark on ${esc(md(q.lesson_date))}.</span><button class="btn danger" id="qnb">Mark them nb…</button></div>` : ''}</div>
    <div class="card"><h2>Students</h2><ul class="dlist">${res.rows.map(r => `<li><div class="nm">${esc(r.name)}${r.linked ? '' : ' <span class="small muted">(no account)</span>'}</div>
      <b style="min-width:36px;text-align:right">${r.score10 == null ? '' : r.score10}</b><div style="text-align:right">${st(r)}</div></li>`).join('')}</ul></div>
    <div class="card"><h2>Most missed</h2>${res.top.length ? res.top.map(x => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row"><b style="flex:1;min-width:0">${x.n}. ${esc(x.prompt)}</b><span class="pill bad">${x.wrongPct}% wrong</span></div>
      <div class="small" style="color:var(--good)">✓ ${esc(x.right)}</div>${x.explain ? `<div class="small muted">${esc(x.explain)}</div>` : ''}</div>`).join('') : '<div class="muted">No results yet.</div>'}
      <h3 style="margin-top:16px">All questions</h3>${res.stats.map(x => `<div class="row small" style="padding:4px 0"><span style="min-width:22px" class="muted">${x.n}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.prompt)}</span>
        <div class="progress" style="width:90px"><i style="width:${x.wrongPct || 0}%;background:var(--bad)"></i></div><span style="min-width:38px;text-align:right">${x.wrongPct == null ? '—' : x.wrongPct + '%'}</span></div>`).join('')}</div>`;
  $('#qback').onclick = () => { stopQuizTimer(); pageQuizzes(); };
  const act = (sel, fn) => { const b = $(sel); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { fail(e); } finally { b.disabled = false; } }; };
  act('#qnot', async () => { const r = await api('notifyQuiz', id); toast(`Sent to ${r.sent} of ${r.of} linked students`); });
  act('#qext', async () => quizLive(id, await api('extendQuiz', id, 2)));
  act('#qclose', async () => { if (!confirm('Close the quiz now? Unfinished students are graded on what they saved.')) return; quizLive(id, await api('closeQuiz', id)); });
  act('#qnb', async () => { if (!confirm('Put nb on ' + md(q.lesson_date) + ' for:\n' + nbCand.map(r => r.name).join('\n'))) return; quizLive(id, await api('quizMarkNb', id, nbCand.map(r => r.row))); S.data = {}; toast('nb saved'); });
  $$('[data-use]').forEach(b => b.onclick = async () => { if (!confirm('Replace the existing mark of ' + b.dataset.use + ' with the quiz mark?')) return; try { quizLive(id, await api('quizUseMark', id, b.dataset.use)); S.data = {}; toast('Saved'); } catch (e) { fail(e); } });
  if (isOpen) {
    const closes = Date.parse(q.closes_at); let n = 0;
    const tickFn = async () => {
      if (my !== S.navId) return stopQuizTimer();
      const left = Math.max(0, Math.round((closes - Date.now() - off) / 1000)); const el = $('#qleft');
      if (el) el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (++n % 6 === 0 || (left === 0 && n % 3 === 0)) {
        try { const r2 = await api('quizResults', id); if (my === S.navId && (r2.done !== res.done || r2.quiz.status !== 'open' || r2.quiz.closes_at !== q.closes_at || JSON.stringify(r2.rows) !== JSON.stringify(res.rows))) { if (r2.quiz.status !== 'open') S.data = {}; quizLive(id, r2); } } catch (e) {}
      }
    };
    tickFn(); quizTimer = setInterval(tickFn, 1000);
  }
}
