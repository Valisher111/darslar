<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darslar</title>
<meta name="theme-color" content="#0b7a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darslar">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7a5f'/%3E%3Cpath d='M18 16h14a16 16 0 0 1 0 32H18z' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --panel:#ffffff; --ink:#14201c; --muted:#5d6d67; --line:#e2e8e5; --soft:#f7faf9;
  --accent:#0b7a5f; --accent-2:#10a37f; --accent-ink:#ffffff; --accent-soft:#e3f4ee;
  --side:#0d2b23; --side-ink:#cfe5dd; --side-muted:#86a89c; --side-on:#16483a;
  --good:#16865a; --warn:#b26a00; --warn-soft:#fff3dd; --bad:#c43a3a; --bad-soft:#fdeceb;
  --changed:#fff5d1; --ro:#f1f4f3;
  --r:14px; --tap:44px; --shadow:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1513; --panel:#151f1c; --ink:#e4efeb; --muted:#93a8a0; --line:#24332e; --soft:#1a2622;
    --accent:#34c79c; --accent-2:#5fd8b2; --accent-ink:#06231a; --accent-soft:#173a30;
    --side:#0a1210; --side-ink:#cfe5dd; --side-muted:#7e978e; --side-on:#173a30;
    --good:#4ccf94; --warn:#e6a940; --warn-soft:#3a2d14; --bad:#ff7b7b; --bad-soft:#3b1f1f;
    --changed:#3b3416; --ro:#1b2622; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:18px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent-2);display:grid;place-items:center;color:#06231a;font-weight:800}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--side-muted)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;min-height:var(--tap);cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:var(--side-on);color:#fff;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;opacity:.9}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:20px;margin:0;margin-right:auto}
.menu-btn{display:none;border:0;background:none;width:var(--tap);height:var(--tap);border-radius:10px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;white-space:nowrap;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.content{padding:24px;max-width:1180px;width:100%;margin:0 auto;padding-bottom:110px}
.overlay{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  body.drawer aside{transform:none}
  body.drawer .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .menu-btn{display:grid;place-items:center}
  .topbar{padding:10px 16px}
  .topbar .chips{order:3;width:100%}
  .content{padding:16px 16px 110px}
}

/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-title h2{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;min-height:var(--tap);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 16px;min-height:38px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--ro);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;min-height:var(--tap)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.loading{padding:50px;text-align:center;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* today */
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero .date{font-size:26px;font-weight:700;letter-spacing:-.01em}
.lesson-card{border-left:4px solid var(--accent)}
.lesson-card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gbadge{font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 9px;font-size:14px}
.progress{height:8px;background:var(--ro);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent-2);border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0 12px}
.kv b{color:var(--muted);font-weight:500}
.up{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.up:last-child{border-bottom:0}
.up .d{min-width:52px;font-weight:700}
.gcard{cursor:pointer;transition:border-color .15s}
.gcard:hover{border-color:var(--accent)}
.gcard .big{font-size:30px;font-weight:700;line-height:1.1}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}

/* grades */
.dlist{list-style:none;margin:0;padding:0}
.dlist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dlist li:last-child{border-bottom:0}
.dlist .nm{flex:1;min-width:0}
.dlist .no{color:var(--muted);min-width:26px}
.mark{width:72px;text-align:center;min-height:var(--tap);border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600}
.mark.changed{background:var(--changed)}
.mark.nb{color:var(--bad)}
.mark.bad{outline:2px solid var(--bad)}
.quick{display:flex;gap:4px}
.quick button{min-width:40px}
.tablewrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px}
table.g th,table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--soft);z-index:2;font-weight:600}
table.g .st{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;max-width:210px;overflow:hidden;text-overflow:ellipsis}
table.g thead .st{z-index:3;background:var(--soft)}
table.g td.ro{background:var(--ro);color:var(--muted)}
table.g td.ed{cursor:pointer}
table.g td.ed:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.g td.nbv{color:var(--bad);font-weight:700}
table.g td.hl{background:var(--changed)}
.lrow{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.lrow .dt{min-width:58px;font-weight:700}
.lrow .dt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lrow.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.slist li:hover{background:var(--accent-soft)}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}

/* misc */
.savebar{position:fixed;left:248px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:30}
@media (max-width:900px){.savebar{left:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:90;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);width:100%;max-width:560px;border-radius:16px;padding:20px;max-height:90vh;overflow:auto}
.modal.pmodal{max-width:440px;padding:14px 16px}

/* ---- live game host (projector) ---- */
#lv{position:fixed;inset:0;z-index:300;background:#0e3b2e;color:#fff;display:flex;flex-direction:column;font-size:18px;overflow:auto}
#lv .lv-top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(0,0,0,.25);flex-wrap:wrap}
#lv .lv-dim{color:#a9cfc1}
#lv .lv-pill{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px;font-weight:700}
#lv .lv-main{flex:1;display:flex;flex-direction:column;padding:24px clamp(16px,4vw,56px);gap:22px;min-height:0}
#lv .lv-btn{background:#fff;color:#0e3b2e;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer}
#lv .lv-btn.ghost{background:rgba(255,255,255,.12);color:#fff;padding:8px 14px;font-weight:600}
#lv .lv-btn.big{font-size:26px;padding:16px 44px}
#lv .lv-btn:disabled{opacity:.4;cursor:default}
#lv .lv-h1{font-size:clamp(26px,3.2vw,44px);font-weight:800;line-height:1.15;text-align:center;margin:0}
#lv .lv-key{background:#fff;color:#0e3b2e;border-radius:10px;padding:0 12px;white-space:nowrap}
#lv .lv-count{text-align:center;font-size:22px}#lv .lv-count b{font-size:64px;display:block;line-height:1}
#lv .lv-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;flex:1}
#lv .lv-chip{background:#fff;color:#0e3b2e;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;font-size:22px;cursor:pointer}
#lv .lv-chip:hover{text-decoration:line-through;background:#ffd5d5}
#lv .lv-center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#lv .lv-prompt{font-size:clamp(26px,3.4vw,50px);font-weight:800;text-align:center;background:#fff;color:#111;border-radius:16px;padding:22px 28px;line-height:1.2}
#lv .lv-mid{display:flex;align-items:center;justify-content:space-between;flex:1;min-height:110px;gap:16px}
#lv .lv-timer{width:130px;height:130px;border-radius:50%;background:#6d28d9;display:grid;place-items:center;font-size:60px;font-weight:800}
#lv .lv-ans{text-align:center;font-size:22px}#lv .lv-ans b{font-size:60px;display:block;line-height:1}
#lv .lv-expl{flex:1;text-align:center;font-size:clamp(18px,2vw,28px);color:#e6f4ee}
#lv .lv-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#lv .lv-opt{display:flex;align-items:center;gap:16px;border-radius:12px;padding:18px 22px;font-size:clamp(20px,2.3vw,34px);font-weight:800;min-height:96px;color:#fff;transition:opacity .3s}
#lv .lv-opt.dim{opacity:.28}
#lv .lv-shape{font-size:1.15em;width:1.3em;text-align:center;flex:none}
#lv .lv-cnt{font-size:1.1em;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 14px}
#lv .lv-board{max-width:860px;width:100%;margin:0 auto;display:grid;gap:12px}
#lv .lv-row{display:flex;align-items:center;gap:18px;background:#fff;color:#111;border-radius:12px;padding:14px 22px;font-size:clamp(22px,2.4vw,32px);font-weight:800}
#lv .lv-row .n{width:44px;color:#6b7280}#lv .lv-row .s{margin-left:auto}
#lv .lv-pod{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,26px);flex:1;min-height:320px}
#lv .lv-pod .col{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(26vw,280px)}
#lv .lv-pod .nm{font-size:clamp(22px,2.6vw,36px);font-weight:800;text-align:center;word-break:break-word}
#lv .lv-pod .bar{width:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-size:44px;font-weight:800}
#lv .lv-note{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;font-size:16px;max-width:860px;margin:0 auto;width:100%}
#lv .lv-lobby{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:28px;flex:1;min-height:0}
#lv .lv-qrbox{background:#fff;color:#0e3b2e;border-radius:18px;padding:20px;text-align:center;align-self:start}
#lv .lv-qrbox .lv-qr{display:flex;justify-content:center;margin:6px 0 12px}
#lv .lv-qrbox .lv-qr img,#lv .lv-qrbox .lv-qr canvas{width:100%!important;max-width:280px;height:auto!important}
#lv .lv-qrbox b{font-size:24px;display:block}
#lv .lv-qrbox small{display:block;color:#4b5563;font-size:14px;margin-top:6px;line-height:1.35}
#lv .lv-right{display:flex;flex-direction:column;gap:18px;min-height:0}
#lv .lv-chip.g{background:#fde68a}
.modal-bg.top{z-index:400}
#lv .lv-racehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#lv .lv-pill.big{font-size:26px;padding:6px 18px}
#lv .lv-racebox{position:relative;flex:1;min-height:200px;overflow-y:auto;overflow-x:hidden;background:rgba(0,0,0,.18);border-radius:16px;padding:8px 0}
#lv .rl{display:grid;grid-template-columns:140px 1fr 150px;align-items:center;height:var(--lh,38px);padding:0 10px;font-size:clamp(12px,calc(var(--lh,38px)*.42),20px);font-weight:700;border-radius:8px}
#lv .rl .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
#lv .rl .rt{position:relative;height:70%;border-bottom:2px dashed rgba(255,255,255,.2)}
#lv .rl .rr{position:absolute;bottom:-2px;transform:translateX(-50%);transition:left .6s ease;font-size:1.35em;line-height:1}
#lv .rl .rs{text-align:right;color:#cfe9df;font-size:.85em;white-space:nowrap}
#lv .rl.caught{background:rgba(226,27,60,.28)} #lv .rl.done .rs{color:#86efac}
#lv .lv-robot{position:absolute;top:0;bottom:0;width:4px;background:rgba(226,27,60,.9);box-shadow:0 0 22px #e21b3c;transition:left .3s linear;pointer-events:none;z-index:2}
#lv .lv-robot span{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:40px;filter:drop-shadow(0 0 6px #e21b3c)}
#lv .lv-finish{position:absolute;top:0;bottom:0;right:156px;border-left:4px dotted rgba(255,255,255,.55);pointer-events:none}
.rep{width:100%;border-collapse:collapse;font-size:14px}.rep th,.rep td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.rep th{font-size:12px;color:var(--muted);font-weight:600}.rep td.n{text-align:right;white-space:nowrap}
.modal.wide{max-width:900px}
@media (max-width:800px){#lv .lv-lobby{grid-template-columns:1fr}}
@media (max-width:700px){#lv .lv-opts{grid-template-columns:1fr}#lv .lv-timer{width:90px;height:90px;font-size:40px}}
.phone{margin:0 auto;width:min(390px,100%);height:min(760px,calc(90vh - 110px));border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.phone iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:600px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0}}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--side) 0%,#0b3a2e 55%,var(--bg) 55.1%)}
.auth .card{width:100%;max-width:400px;padding:28px}
.auth .logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:14px}
.check{display:flex;align-items:center;gap:8px;margin:4px 0 16px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="auth hidden">
  <div class="card">
    <div class="logo">D</div>
    <h2 id="auth-title" style="font-size:22px;margin-bottom:4px">Darslar</h2>
    <p class="muted" id="auth-sub" style="margin-top:0">Teacher dashboard · V.A. Tangriyev</p>
    <form id="auth-form" autocomplete="on">
      <input type="text" name="username" value="teacher" autocomplete="username" class="hidden" readonly>
      <label class="f"><span>Password</span><input type="password" id="pw1" autocomplete="current-password" required></label>
      <label class="f hidden" id="pw2-wrap"><span>Repeat password</span><input type="password" id="pw2" autocomplete="new-password"></label>
      <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
      <button class="btn primary" style="width:100%" id="auth-btn">Sign in</button>
      <p class="small muted" id="auth-msg" style="margin-bottom:0"></p>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <aside>
    <div class="brand"><div class="logo">D</div><div>Darslar<small>2026–2027 · DTPI</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="title">Today</h1>
      <div class="chips" id="chips"></div>

<script>
/* ===================== config ===================== */
const API = 'https://script.google.com/macros/s/AKfycbzP51ZVzUqdzT-iV_Un8g82e7SvX-iSIDm2Qm1oz05AkdDPkWnNw0Yk_C9JCf6HEvqH/exec';
const ICONS = {
  today: '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M9 15l2 2 4-4"/>',
  grades: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  lessons: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  students: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',
  deadlines: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  quizzes: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const PAGES = [
  ['today', 'Today'], ['grades', 'Grades'], ['lessons', 'Lessons'], ['students', 'Students'],
  ['deadlines', 'Deadlines & PW'], ['quizzes', 'Quizzes'], ['settings', 'Settings']
];
const GROUP_PAGES = ['grades', 'lessons', 'students', 'deadlines', 'quizzes'];

/* ===================== helpers ===================== */
const $ = (q, el) => (el || document).querySelector(q);
const $$ = (q, el) => Array.from((el || document).querySelectorAll(q));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, persist) { try { (persist ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};
let toastTimer;
function toast(msg, err) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), err ? 6000 : 2600);
}
const fail = e => toast((e && e.message) || String(e), true);
const view = () => $('#view');
const loading = () => { view().innerHTML = '<div class="loading">Loading…</div>'; };
function modal(html, init) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeModal(); });
  document.body.appendChild(bg); if (init) init(bg);
}
function closeModal() { $$('.modal-bg').forEach(m => m.remove()); }
function ddKey(s) { const m = /^(\d{2})\.(\d{2})$/.exec(s || ''); if (!m) return 0; let mo = +m[2]; if (mo < 8) mo += 12; return mo * 100 + (+m[1]); }
function longDate(ddmm) {
  const now = new Date(); const [d, m] = ddmm.split('.').map(Number);
  let y = now.getFullYear(); if (now.getMonth() >= 7 && m < 8) y++; if (now.getMonth() < 7 && m >= 8) y--;
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function shortDay(ddmm) {
  const now = new Date(); const [d, m] = ddmm.split('.').map(Number);
  let y = now.getFullYear(); if (now.getMonth() >= 7 && m < 8) y++;
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short' });
}

/* ===================== API ===================== */
let KEY = store.get('dp_key');
async function api(action, ...args) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, key: KEY, args }) });
  if (!r.ok) throw new Error('Server error ' + r.status);
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { signOut(true); throw new Error('Please sign in again.'); }
    throw new Error(j.error);
  }
  return j.data;
}

/* ===================== state ===================== */
const S = {
  page: 'today', groups: [], subjects: {}, group: store.get('dp_group'), today: '',
  data: {}, pending: {}, view: 'day', day: {}, block: 1, profile: null
};

/* ===================== auth ===================== */
let authMode = 'login', setupKey = null;
async function startAuth() {
  $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden');
  const m = /setup=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) { setupKey = m[1]; authMode = 'setup'; }
  if (authMode === 'setup') {
    $('#auth-title').textContent = 'Create your password';
    $('#auth-sub').textContent = 'You will use it to open Darslar on any device.';
    $('#pw2-wrap').classList.remove('hidden'); $('#pw1').autocomplete = 'new-password';
    $('#auth-btn').textContent = 'Save password';
  }
  setTimeout(() => $('#pw1').focus(), 50);
}
$('#auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw1').value, btn = $('#auth-btn'), msg = $('#auth-msg');
  msg.textContent = ''; btn.disabled = true;
  try {
    let res;
    if (authMode === 'setup') {
      if (pw.length < 6) throw new Error('At least 6 characters, please.');
      if (pw !== $('#pw2').value) throw new Error('The two passwords do not match.');
      res = await api('setPassword', setupKey, pw);
      history.replaceState(null, '', location.pathname);
    } else {
      res = await api('login', pw);
    }
    KEY = res.key; store.set('dp_key', KEY, $('#remember').checked);
    $('#pw1').value = ''; $('#pw2').value = '';
    authMode = 'login'; boot();
  } catch (err) { msg.textContent = err.message; msg.style.color = 'var(--bad)'; }
  finally { btn.disabled = false; }
});
function signOut(silent) {

function buildNav() {
  $('#nav').innerHTML = PAGES.map(([id, label]) =>
    `<a data-p="${id}" href="#/${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${label}</a>`).join('');

function go(page, group) {

}
window.addEventListener('hashchange', () => { if (KEY) route(); });
function route() {
  if (Object.keys(S.pending).length && !confirm(Object.keys(S.pending).length + ' unsaved change(s) will be lost. Continue?')) return;
  S.pending = {}; updateSavebar(); S.navId = (S.navId || 0) + 1; stopQuizTimer();

function renderChips() {

}

$('#overlay').onclick = () => document.body.classList.remove('drawer');

function getGroup(force) {
  if (S.data[S.group] && !force) return Promise.resolve(S.data[S.group]);
  return api('group', S.group).then(d => (S.data[d.group] = d));
}

/* ===================== pending + save ===================== */
const colOf = c => S.data[S.group].cols[c - 1];
const editable = c => c.kind === 'day' || c.kind === 'manual' || c.kind === 'team';
function validMark(col, v) {
  v = String(v).trim(); if (v === '') return true;
  if (col.kind === 'team') return v.length <= 30;
  if (col.kind === 'day' && v.toLowerCase() === 'nb') return true;
  const n = Number(v.replace(',', '.')); return isFinite(n) && n >= 0 && n <= col.max;
}
function setPending(row, col, value) {
  const st = S.data[S.group].students.find(s => s.row === row);
  const key = row + ':' + col; value = String(value).trim();
  if (value === String(st.v[col - 1] || '')) delete S.pending[key]; else S.pending[key] = { row, col, value };
  updateSavebar();
}
function pv(row, col) {
  const p = S.pending[row + ':' + col]; if (p) return p.value;
  return S.data[S.group].students.find(s => s.row === row).v[col - 1] || '';
}
function updateSavebar() {
  const n = Object.keys(S.pending).length;
  $('#savebar').classList.toggle('hidden', !n);
  $('#savecount').textContent = n + ' unsaved change' + (n === 1 ? '' : 's');
}
$('#discard').onclick = () => { S.pending = {}; updateSavebar(); route(); };
$('#saveall').onclick = async () => {
  const entries = Object.values(S.pending);
  const bad = entries.find(e => !validMark(colOf(e.col), e.value));
  if (bad) return toast('Not allowed: "' + bad.value + '". Use 0–' + colOf(bad.col).max + ' or nb.', true);
  $('#saveall').disabled = true;
  try {
    const rows = await api('save', S.group, entries);
    const d = S.data[S.group];
    Object.keys(rows).forEach(r => { const st = d.students.find(s => s.row === +r); if (st) st.v = rows[r]; });
    S.pending = {}; updateSavebar(); toast('Saved ' + entries.length + ' change' + (entries.length === 1 ? '' : 's') + ' to the gradebook');
    route();
  } catch (e) { fail(e); } finally { $('#saveall').disabled = false; }
};

      <ul class="dlist">${d.students.map(s => {
        const v = String(pv(s.row, cn)); const ch = S.pending[s.row + ':' + cn] ? ' changed' : ''; const nb = v.toLowerCase() === 'nb' ? ' nb' : '';
        return `<li><span class="no">${esc(s.no)}</span><div class="nm">${esc(s.name)}</div>

    <label class="f"><span>${hint}</span><input type="text" id="cv" inputmode="${c.kind === 'team' ? 'text' : 'decimal'}" value="${esc(pv(row, cn))}"></label>
    <div class="row">${c.kind === 'day' ? '<button class="btn danger" id="cnb">nb</button>' : ''}<button class="btn" id="cclr">Clear</button>

function chart(series) {
  const pts = series.filter(s => s.raw !== '');
  if (!pts.length) return '<div class="muted">No marks yet.</div>';
  const W = Math.max(340, pts.length * 30), H = 190, L = 28, B = 30, T = 12;
  const x = i => L + 12 + i * ((W - L - 24) / Math.max(1, pts.length - 1)), y = v => T + (H - T - B) * (1 - v / 10);
  let path = '', area = '', grid = '';
  [0, 5, 10].forEach(v => grid += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`);
  const real = pts.map((p, i) => [p, i]).filter(([p]) => p.val != null);
  real.forEach(([p, i], k) => path += (k ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.val).toFixed(1));
  if (real.length) area = path + `L${x(real[real.length - 1][1]).toFixed(1)} ${y(0)}L${x(real[0][1]).toFixed(1)} ${y(0)}Z`;
  const dots = pts.map((p, i) => p.val == null
    ? `<text x="${x(i)}" y="${y(0) + 3}" text-anchor="middle" style="fill:var(--bad);font-weight:700;font-size:13px">×<title>${p.date}: nb</title></text>`
    : `<circle cx="${x(i)}" cy="${y(p.val)}" r="4" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"><title>${p.date}: ${p.raw}</title></circle>`).join('');
  const labels = pts.map((p, i) => i % 2 === 0 ? `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${p.date}</text>` : '').join('');
  return `<div style="overflow-x:auto"><svg width="${W}" height="${H}" role="img" aria-label="Daily marks">${grid}<path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}${labels}</svg></div><div class="small muted">× = absent (nb)</div>`;
}

function qBody(q, showAnswer) {
  const ok = s => `<div class="small" style="color:var(--good);margin-top:4px">✓ ${esc(s)}</div>`;

  if (q.type === 'tf') return showAnswer ? ok(q.answer ? 'True' : 'False') : '';
  if (q.type === 'gap') return showAnswer ? ok(q.accept.join(' / ')) : '';
  if (q.type === 'match') return `<div class="small" style="margin-top:4px">${q.pairs.map(p => `${esc(p[0])} → <b>${esc(p[1])}</b>`).join('<br>')}</div>`;

  return '';
}

async function lvRaceEnd() {
  if (!LV || LV.raceEnding) return; LV.raceEnding = true; clearInterval(LV.tick);
  const st = LV.state, sc = {};

    const bonus = r.done ? Math.round(Math.max(0, st.startedAt + st.dur * 1000 - r.last) / 1000) * 10 : 0;   // finishing early earns extra points
    sc[r.uid] = { nick: r.nick, score: r.right * 1000 + bonus, right: r.right, last: 0, lastOk: false, answered: r.answered > 0, rank: 0 };
  });
  Object.keys(sc).sort((a, b) => sc[b].score - sc[a].score).forEach((u, i) => { sc[u].rank = i + 1; });
  LV.sc = sc;

}
async function lvReveal(i) {

function lvScores(upto) {
  const players = lvValid(), res = {};
  players.forEach(p => { res[p.uid] = { nick: p.nick, score: 0, last: 0, right: 0, lastOk: false, answered: false, rank: 0 }; });
  for (let i = 0; i <= upto; i++) {
    const q = LV.P.questions[i], m = LV.qmeta[i], ans = (LV.ans && LV.ans[i]) || {};
    if (!m) continue;
    players.forEach(p => {
      const a = ans[p.uid], r = res[p.uid]; let pts = 0, ok = false;
      if (a && a.a === q.correct && a.t <= m.startedAt + m.dur * 1000 + 1500) {
        ok = true; const rt = Math.max(0, a.t - m.startedAt) / (m.dur * 1000); pts = Math.round(1000 * (1 - Math.min(1, rt) / 2));
      }
      r.score += pts; if (ok) r.right++;
      if (i === upto) { r.last = pts; r.lastOk = ok; r.answered = !!a; }
    });
  }
  Object.keys(res).sort((a, b) => res[b].score - res[a].score).forEach((u, k) => { res[u].rank = k + 1; });
  return res;
}
function lvComputeReveal(i) {
  if (LV.rp && LV.rp.i === i) return LV.rp.p;
  const p = (async () => {
    LV.ans = (await LV.g.child('answers').once('value')).val() || {};
    const q = LV.P.questions[i], counts = q.options.map(() => 0);
    Object.values(LV.ans[i] || {}).forEach(a => { if (a && counts[a.a] !== undefined) counts[a.a]++; });
    LV.rev[i] = { correct: q.correct, counts }; LV.sc = lvScores(i);
    await LV.g.update({ ['reveal/' + i]: LV.rev[i], scores: LV.sc });
  })();
  LV.rp = { i, p }; return p;
}
async function lvSave() {
  const P = LV.P; LV.saving = true; lvRender();

      const race = (await LV.g.child('race').once('value')).val() || {}, end = LV.state.startedAt + LV.state.dur * 1000 + 1500;
      players.forEach(p => { const a = race[p.uid] || {}; P.questions.forEach((q, i) => { const v = a[i]; if (v && v.t <= end) (all[i] = all[i] || {})[p.uid] = v; }); });
    } else all = (await LV.g.child('answers').once('value')).val() || {};

      ${isOpen ? `<div class="row" style="margin-top:14px"><button class="btn" id="qnot">Notify students</button><button class="btn" id="qext">+2 min</button><span class="spacer"></span><button class="btn danger" id="qclose">Close now</button></div>` : ''}
      ${!isOpen && nbCand.length && res.dateOk ? `<div class="row" style="margin-top:14px"><span class="small muted" style="flex:1">${nbCand.length} did not take it and have no mark on ${esc(q.lesson_date)}.</span><button class="btn danger" id="qnb">Mark them nb…</button></div>` : ''}</div>
    <div class="card"><h2>Students</h2><ul class="dlist">${res.rows.map(r => `<li><div class="nm">${esc(r.name)}${r.linked ? '' : ' <span class="small muted">(no account)</span>'}</div>
      <b style="min-width:36px;text-align:right">${r.score10 == null ? '' : r.score10}</b><div style="text-align:right">${st(r)}</div></li>`).join('')}</ul></div>
    <div class="card"><h2>Most missed</h2>${res.top.length ? res.top.map(x => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row"><b style="flex:1;min-width:0">${x.n}. ${esc(x.prompt)}</b><span class="pill bad">${x.wrongPct}% wrong</span></div>
      <div class="small" style="color:var(--good)">✓ ${esc(x.right)}</div>${x.explain ? `<div class="small muted">${esc(x.explain)}</div>` : ''}</div>`).join('') : '<div class="muted">No results yet.</div>'}
      <h3 style="margin-top:16px">All questions</h3>${res.stats.map(x => `<div class="row small" style="padding:4px 0"><span style="min-width:22px" class="muted">${x.n}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.prompt)}</span>
        <div class="progress" style="width:90px"><i style="width:${x.wrongPct || 0}%;background:var(--bad)"></i></div><span style="min-width:38px;text-align:right">${x.wrongPct == null ? '—' : x.wrongPct + '%'}</span></div>`).join('')}</div>`;
  $('#qback').onclick = () => { stopQuizTimer(); pageQuizzes(); };
  const act = (sel, fn) => { const b = $(sel); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { fail(e); } finally { b.disabled = false; } }; };
  act('#qnot', async () => { const r = await api('notifyQuiz', id); toast(`Sent to ${r.sent} of ${r.of} linked students`); });
  act('#qext', async () => quizLive(id, await api('extendQuiz', id, 2)));
  act('#qclose', async () => { if (!confirm('Close the quiz now? Unfinished students are graded on what they saved.')) return; quizLive(id, await api('closeQuiz', id)); });
  act('#qnb', async () => { if (!confirm('Put nb on ' + q.lesson_date + ' for:\n' + nbCand.map(r => r.name).join('\n'))) return; quizLive(id, await api('quizMarkNb', id, nbCand.map(r => r.row))); S.data = {}; toast('nb saved'); });
  $$('[data-use]').forEach(b => b.onclick = async () => { if (!confirm('Replace the existing mark of ' + b.dataset.use + ' with the quiz mark?')) return; try { quizLive(id, await api('quizUseMark', id, b.dataset.use)); S.data = {}; toast('Saved'); } catch (e) { fail(e); } });
  if (isOpen) {
    const closes = Date.parse(q.closes_at); let n = 0;
    const tickFn = async () => {
      if (my !== S.navId) return stopQuizTimer();
      const left = Math.max(0, Math.round((closes - Date.now() - off) / 1000)); const el = $('#qleft');
      if (el) el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (++n % 6 === 0 || (left === 0 && n % 3 === 0)) {
        try { const r2 = await api('quizResults', id); if (my === S.navId && (r2.done !== res.done || r2.quiz.status !== 'open' || r2.quiz.closes_at !== q.closes_at || JSON.stringify(r2.rows) !== JSON.stringify(res.rows))) { if (r2.quiz.status !== 'open') S.data = {}; quizLive(id, r2); } } catch (e) {}
      }
    };
    tickFn(); quizTimer = setInterval(tickFn, 1000);
  }
}

/* ===================== SETTINGS ===================== */
async function pageSettings() {
  loading();
  try {
    const my = S.navId; const s = await api('settings'); if (my !== S.navId) return;
    view().innerHTML = `<div class="grid g2">
      <div class="card"><h2>Password</h2>
        <label class="f"><span>Current password</span><input type="password" id="op" autocomplete="current-password"></label>
        <label class="f"><span>New password (6+ characters)</span><input type="password" id="np" autocomplete="new-password"></label>
        <button class="btn primary" id="cpw">Change password</button></div>
      <div class="card"><h2>Sessions</h2><p class="muted">Sign out here, or sign out on every phone and computer at once (for example, if you lost your phone).</p>
        <div class="row"><button class="btn" id="so">Sign out</button><button class="btn danger" id="soa">Sign out everywhere</button></div></div>
      <div class="card"><h2>Minimum mark for quiz takers</h2><p class="muted">When on, a student who takes an in-class quiz gets at least 5.</p>
        <div class="seg"><button data-m="off" class="${s.minAttendScore !== 'on' ? 'on' : ''}">Off</button><button data-m="on" class="${s.minAttendScore === 'on' ? 'on' : ''}">On</button></div></div>
      <div class="card"><h2>Student bot</h2>
        ${s.botTokenSet ? `<p>Status: <b style="color:var(--good)">connected</b> · <a href="https://t.me/${esc(s.botUsername)}" target="_blank" rel="noopener">@${esc(s.botUsername)}</a><br>
          <span class="small muted">Send this link to your groups: students press Start, choose their name, you approve.</span></p>
          <p class="small">Your Telegram: ${s.teacherLinked ? '<b style="color:var(--good)">connected</b> — approval requests come to you in the bot.' : '<b>not connected</b> — connect it to approve students right in Telegram.'}</p>
          <div class="row" style="margin-bottom:14px"><button class="btn primary" id="tgme">${s.teacherLinked ? 'Reconnect my Telegram' : 'Connect my Telegram'}</button></div>`
        : '<p class="muted">Not connected yet. Create a new bot in @BotFather (/newbot) and paste its token here.</p>'}
        <div class="row"><input type="text" id="bt" placeholder="${s.botTokenSet ? 'New token (only to replace)' : '123456:ABC…'}" autocomplete="off" style="flex:1;min-width:200px"><button class="btn" id="bts">Save</button></div></div>
    </div><p class="small muted" style="margin-top:16px">Groups: ${s.groups.map(esc).join(', ')} · Version ${esc(s.version)} · Data: Google Sheets “Baholash jurnali 2026-2027”</p>`;
    $('#cpw').onclick = async () => { try { await api('changePassword', $('#op').value, $('#np').value); $('#op').value = $('#np').value = ''; toast('Password changed'); } catch (e) { fail(e); } };
    $('#so').onclick = () => signOut();
    $('#soa').onclick = async () => { if (!confirm('Sign out on all devices?')) return; try { await api('logoutAll'); signOut(); } catch (e) { fail(e); } };
    $$('[data-m]').forEach(b => b.onclick = async () => { try { await api('setMinAttend', b.dataset.m === 'on'); toast('Saved'); pageSettings(); } catch (e) { fail(e); } });
    $('#bts').onclick = async () => { $('#bts').disabled = true; try { await api('setBotToken', $('#bt').value); toast('Bot connected'); pageSettings(); } catch (e) { $('#bts').disabled = false; fail(e); } };
    if ($('#tgme')) $('#tgme').onclick = async () => {
      try { const link = await api('teacherTgLink');
        modal(`<h3>Connect your Telegram</h3><p class="muted">Open the bot and press <b>Start</b>. The link works for 15 minutes, only once.</p>
          <div class="row"><span class="spacer"></span><button class="btn" data-close>Close</button><a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener" data-close>Open Telegram</a></div>`);
      } catch (e) { fail(e); } };
  } catch (e) { fail(e); }
}

/* ===================== start ===================== */
window.addEventListener('beforeunload', e => { if (Object.keys(S.pending).length) { e.preventDefault(); e.returnValue = ''; } });
KEY && !/setup=/.test(location.hash) ? boot() : startAuth();
</script>
