<script>

   s.html#v=<view token> — from the student bot (/student → a real student), token lives 6 h on the server;

const VIEW = VWm ? VWm[1] : null, AS = ASm ? decodeURIComponent(ASm[1]) : null;

async function api(action, ...args) {
  if (READONLY && /^st/.test(action)) {
    if (action === 'stHome') { if (VIEW) { action = 'viewHome'; args = [VIEW]; } else { const i = AS.indexOf('|'); action = 'studentView'; args = [AS.slice(0, i), AS.slice(i + 1)]; } }
    else if (action === 'stPing') return { open: null, closes: null, live: null };
    else throw new Error("O'qituvchi ko'rinishi — faqat ko'rish uchun. O'zingiz sinash uchun 🧪 test talabadan foydalaning (botda /student).");
  }
  const r = await apiFetch(JSON.stringify({ action, key: KEY, args }));
  if (!r.ok) throw new Error('Server xatosi ' + r.status + ". Qayta urinib ko'ring.");
  const j = await r.json();
  if (!j.ok) { if (j.error === 'LINK_INVALID') { noAccess(); throw new Error('Bu havola endi ishlamaydi.'); } throw new Error(j.error); }
  return j.data;
}

function chart(series) {
  const pts = series.filter(s => s.raw !== ''); if (pts.length < 2) return '';
  const W = Math.max(320, pts.length * 26), Ht = 150, L = 22, B = 22, T = 10;
  const x = i => L + 10 + i * ((W - L - 20) / Math.max(1, pts.length - 1)), y = v => T + (Ht - T - B) * (1 - v / 10);
  let path = '', grid = '';
  [0, 5, 10].forEach(v => grid += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${v}</text>`);
  pts.map((p, i) => [p, i]).filter(([p]) => p.val != null && !isAbs(p.raw)).forEach(([p, i], k) => path += (k ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.val).toFixed(1));
  const dots = pts.map((p, i) => p.val == null || isAbs(p.raw) ? `<text x="${x(i)}" y="${y(0) + 3}" text-anchor="middle" style="fill:var(--bad);font-weight:700;font-size:12px">×</text>` : `<circle cx="${x(i)}" cy="${y(p.val)}" r="3.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>`).join('');
  return `<div class="card"><h2>Baholarim</h2><div style="overflow-x:auto"><svg width="${W}" height="${Ht}" role="img" aria-label="Baholar grafigi">${grid}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}</svg></div><div class="small muted">× = kelmagan</div></div>`;
}

const HK = 'dq_hide';
function beacon(action, args) {

}

/* "Did a quiz or live game open?" — the teacher site bumps sig/<group> in Firebase, the page listens
   (one light stream, no server calls). A slow check every 2 min stays as a fallback. */
let SIG = null, sigLast, lastCheck = 0;
function sigOpen() {
  if (!H || SIG || document.hidden || PREVIEW || !window.EventSource) return;
  try {
    SIG = new EventSource(FB_CFG.databaseURL + '/sig/' + encodeURIComponent(sigKey(H.group)) + '.json');
    const on = e => { let d = null; try { d = JSON.parse(e.data); } catch (x) { return; } const v = d ? d.data : null; if (sigLast !== undefined && v !== sigLast) setTimeout(checkNow, Math.random() * 2500); sigLast = v; };
    SIG.addEventListener('put', on); SIG.addEventListener('patch', on);
  } catch (e) { SIG = null; }
}
function sigClose() { if (SIG) { try { SIG.close(); } catch (e) {} SIG = null; sigLast = undefined; } }
async function checkNow() {
  if (document.hidden || Q || SL || !H) return;
  lastCheck = Date.now();
  try { const p = await api('stPing'); if ((p.open || null) !== (H.quiz ? H.quiz.quiz_id : null) || (p.live || null) !== (H.live ? H.live.gid : null)) load(true); } catch (e) {}
}
function startPing() {
  clearInterval(pingT); lastCheck = Date.now();
  pingT = setInterval(() => { const ok = SIG && SIG.readyState === 1; if (Date.now() - lastCheck >= (ok ? 120000 : 30000)) checkNow(); }, 10000);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) sigClose(); else if (H && !Q && !SL && !PREVIEW) { sigOpen(); checkNow(); } });

  const s = $('#slzs'); if (!s) return;
  const z = zs[mk], n = z && cnt ? cnt[mk] || 0 : 0, out = zc ? zc.out || 0 : null;
  s.innerHTML = mk < 0 ? '🚶 Siz tashqaridasiz. Yashil zonaga kiring!' : n > z.cap ? `⚠️ ${RR_ZL[mk]} zona to'lib ketdi (${n}/${z.cap})! Kimdir chiqishi kerak.` : `✅ Siz ${RR_ZL[mk]} zonadasiz${cnt ? ` (${n}/${z.cap})` : ''}. Shu yerda turing!${out ? ` · ${out} kishi hali tashqarida` : ''}`;
  s.style.background = mk < 0 ? 'rgba(226,27,60,.4)' : n > z.cap ? 'rgba(216,158,0,.5)' : 'rgba(38,137,12,.45)';
}
function slRrMsg() {
  const st = SL.state, el = $('#live'); clearInterval(SL.walkT); SL.walkT = null; SL.walkTo = null;
  let h;
  if (st.phase === 'caught') h = `<div class="lvs-big" style="margin-top:12vh">${st.why === 'lives' ? '💔 Jon qolmadi!' : '🤖 Robot jamoani ushlab oldi!'}</div><div class="lvs-card">${st.lvl}-bosqich qaytadan boshlanadi. Tezroq javob bering va ⚡ tezlatishdan foydalaning!</div>`;
  else if (st.phase === 'lvlup') h = `<div class="lvs-big" style="margin-top:12vh">🎉 ${st.lvl}-bosqich bajarildi!</div><div class="lvs-card">Zo'r jamoaviy ish! ${st.lvl + 1}-bosqich qiyinroq.</div>`;
  else {
    const me = SL.pos, zs = st.zones || [], k = me ? zs.findIndex(z => slIn(z, me)) : -1, over = k >= 0 && (st.over || []).includes(k);
    h = `<div class="lvs-big" style="margin-top:6vh">${st.ok ? '✅ Hamma xavfsiz!' : '❌ Hamma ham xavfsiz emas'}</div>
      <div class="lvs-card">${k < 0 ? 'Siz zonalardan tashqarida edingiz.' : over ? `${RR_ZL[k]} zonada o'yinchilar juda ko'p edi.` : `Siz ${RR_ZL[k]} zonada xavfsiz edingiz 👍`}<br><span class="lvs-dim">${st.ok ? (st.wave < st.waves ? 'Keyingi to\'lqin…' : 'Bosqich bajarildi!') : st.lives > 0 ? `${st.lives} ta jon qoldi — yana urinib ko'ring!` : 'Jon qolmadi — bosqich qaytadan boshlanadi.'}</span></div>
      <div class="lvs-map" id="slmap"></div>`;
  }
  el.innerHTML = slBox(h + '<p class="lvs-dim" style="text-align:center">Ekranga qarang.</p>');
  slZoneDraw();
}
async function slAnswer(k, c) {
  if (!SL || SL.sent || k == null || !SL.state || SL.state.phase !== 'question') return;
  const qi = SL.state.q, v = { a: k, t: firebase.database.ServerValue.TIMESTAMP }; if (c) v.c = c;
  SL.sent = { a: k, c }; slRender();
  try { await SL.g.child(`answers/${qi}/${SL.fb.uid}`).set(v); }
  catch (e) { if (SL && SL.qi === qi) { SL.sent = null; SL.late = true; slRender(); } }
}

if (PREVIEW) startPreview(); else if (PLAY) joinLive(PLAY); else if (KEY) { load(); startPing(); } else noAccess();
