<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My lessons · Darslar</title>
<meta name="theme-color" content="#0b7a5f">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7a5f'/%3E%3Cpath d='M18 16h14a16 16 0 0 1 0 32H18z' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --panel:#fff; --ink:#14201c; --muted:#5d6d67; --line:#e2e8e5; --soft:#f7faf9;
  --accent:#0b7a5f; --accent-2:#10a37f; --accent-ink:#fff; --accent-soft:#e3f4ee; --head:#0d2b23;
  --good:#16865a; --good-soft:#e3f4ee; --warn:#b26a00; --warn-soft:#fff3dd; --bad:#c43a3a; --bad-soft:#fdeceb; --ro:#f1f4f3;
  --r:16px; --tap:48px; --shadow:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1513; --panel:#151f1c; --ink:#e4efeb; --muted:#93a8a0; --line:#24332e; --soft:#1a2622;
    --accent:#34c79c; --accent-2:#5fd8b2; --accent-ink:#06231a; --accent-soft:#173a30; --head:#0a1210;
    --good:#4ccf94; --good-soft:#173a30; --warn:#e6a940; --warn-soft:#3a2d14; --bad:#ff7b7b; --bad-soft:#3b1f1f; --ro:#1b2622; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* ---- live game (student) ---- */
#live{min-height:100vh;background:#0e3b2e;color:#fff;padding:14px 16px 40px}
.lvs{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.lvs-big{font-size:26px;font-weight:800;text-align:center;margin-top:22vh;line-height:1.25}
.lvs-h{font-size:24px;margin:0;color:#fff}
.lvs-dim{color:#a9cfc1}
#live input{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:12px;border:0;color:#111;background:#fff}
.lvs-go{background:#fff!important;color:#0e3b2e!important;font-weight:800!important;font-size:20px!important;padding:14px!important;border:0!important}
.lvs-q{background:#fff;color:#111;border-radius:14px;padding:16px;font-size:20px;font-weight:700;line-height:1.3}
.lvs-opts{display:grid;gap:10px}
.lvs-opt{display:flex;align-items:center;gap:12px;border:0;border-radius:12px;padding:14px 16px;min-height:62px;color:#fff;font:inherit;font-size:18px;font-weight:700;text-align:left;cursor:pointer;width:100%}
.lvs-opt .sh{font-size:24px;width:28px;text-align:center;flex:none}
.lvs-opt.dim{opacity:.3}.lvs-opt.pick{box-shadow:0 0 0 4px #fff}
.lvs-opt:disabled{cursor:default}
.lvs-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvs-timer{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 14px;font-weight:800;font-size:20px;min-width:56px;text-align:center}
.lvs-res{border-radius:16px;padding:24px 16px;text-align:center;font-size:30px;font-weight:800}
.lvs-res small{display:block;font-size:17px;font-weight:600;margin-top:6px}
.lvs-res.ok{background:#26890c}.lvs-res.no{background:#e21b3c}.lvs-res.na{background:#4b5563}
.lvs-card{background:rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center;font-size:18px}
.lvs-card b{font-size:30px;display:block}
.livecard{background:linear-gradient(135deg,#0e3b2e,#17694f)!important;color:#fff;border:0!important}

header{background:var(--head);color:#fff;padding:18px 16px 54px}
header .in,.wrap{max-width:640px;margin:0 auto}
header .hi{font-size:13px;color:#9cc3b5}
header h1{margin:2px 0 0;font-size:21px;line-height:1.25}
header .sub{font-size:13px;color:#9cc3b5;margin-top:2px}
.wrap{padding:0 16px calc(96px + env(safe-area-inset-bottom));margin-top:-40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--ro);color:var(--muted)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 18px;min-height:var(--tap);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.mk{min-width:44px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.mk.nb{background:var(--bad-soft);color:var(--bad)} .mk.low{background:var(--warn-soft);color:var(--warn)}
.quizcard{border:2px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%)}
.quizcard .t{font-size:18px;font-weight:700}
.big{font-size:40px;font-weight:700;line-height:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:90;max-width:92vw}
.toast.err{background:var(--bad);color:#fff}
/* quiz */
.qtop{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:12px 16px}
.qtop .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:10px}
.timer.low{background:var(--bad);color:#fff}
.qprog{height:4px;background:rgba(255,255,255,.15)} .qprog i{display:block;height:100%;background:var(--accent-2);transition:width .2s}
.qwrap{max-width:640px;margin:0 auto;padding:14px 16px 120px}
.q .n{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.q .p{font-weight:600;font-size:17px;margin:4px 0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;min-height:var(--tap);margin-bottom:8px;cursor:pointer}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)} .opt.on .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input.gap{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;min-height:var(--tap)}
input.gap:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;margin-bottom:8px}
.mrow .l{font-weight:500}
select{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;min-height:var(--tap)}
.ord{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px;background:var(--panel)}
.ord .tx{flex:1;min-width:0}
.ord button{width:40px;height:40px;border:1px solid var(--line);background:var(--soft);border-radius:10px;cursor:pointer;font-size:16px}
.qbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.qbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.rv{padding:10px 0;border-bottom:1px solid var(--line)} .rv:last-child{border-bottom:0}
.pvbar{background:#fef3c7;color:#92400e;padding:8px 14px;font-size:13px;text-align:center;font-weight:600}
.rv .y{color:var(--bad)} .rv.ok .y{color:var(--good)} .rv .r{color:var(--good)}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
</style>
</head>
<body>
<div id="main">
  <header><div class="in"><div class="hi" id="hi">Darslar</div><h1 id="who">Loading…</h1><div class="sub" id="sub"></div></div></header>
  <div class="wrap" id="view"><div class="card loading">Loading…</div></div>
  <nav class="tabs hidden" id="tabs"><div class="in"></div></nav>
</div>
<div id="quiz" class="hidden"></div>
<div id="live" class="hidden"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzP51ZVzUqdzT-iV_Un8g82e7SvX-iSIDm2Qm1oz05AkdDPkWnNw0Yk_C9JCf6HEvqH/exec';
const $ = (q, el) => (el || document).querySelector(q), $$ = (q, el) => Array.from((el || document).querySelectorAll(q));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function toast(m, err) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2600); }
const fail = e => toast((e && e.message) || String(e), true);
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
function dayName(ddmm) { const now = new Date(); const [d, m] = ddmm.split('.').map(Number); let y = now.getFullYear(); if (now.getMonth() >= 7 && m < 8) y++; if (now.getMonth() < 7 && m >= 8) y--; return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }

let KEY = null;
const m = /k=([a-f0-9]{40})/.exec(location.hash);
if (m) { KEY = m[1]; ls.set('ds_k', KEY); } else KEY = ls.get('ds_k');
// Teacher "Student view": s.html#preview=<quiz_id>, opened from the teacher site (uses the teacher key, writes nothing)
const PLm = /play=([a-f0-9]{16,64})/.exec(location.hash);
const PLAY = PLm ? PLm[1] : null;   // opened from the QR code on the projector
const PVm = /preview=([^&]+)/.exec(location.hash);
const PREVIEW = PVm ? decodeURIComponent(PVm[1]) : null;
if (PREVIEW) {
  KEY = null;
  try { if (parent !== window && parent.dpKey) KEY = parent.dpKey(); } catch (e) {}
  if (!KEY) { try { KEY = localStorage.getItem('dp_key') || sessionStorage.getItem('dp_key'); } catch (e) {} }
}

async function api(action, ...args) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, key: KEY, args }) });
  if (!r.ok) throw new Error('Server error ' + r.status + '. Try again.');
  const j = await r.json();
  if (!j.ok) { if (j.error === 'LINK_INVALID') { noAccess(); throw new Error('This link no longer works.'); } throw new Error(j.error); }
  return j.data;
}
function noAccess() {
  $('#who').textContent = 'Personal link needed'; $('#sub').textContent = ''; $('#tabs').classList.add('hidden');
  $('#view').innerHTML = `<div class="card"><h2>Open your page from Telegram</h2><p class="muted">Open the student bot of your teacher and send <b>/link</b>. You will get your personal link. If you are new, send <b>/start</b> and choose your name.</p></div>`;
}

const TABS = [['home', 'Home', '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'], ['marks', 'Marks', '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ['lessons', 'Lessons', '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>'], ['quizzes', 'Quizzes', '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>']];
let H = null, tab = 'home', pingT = null;
function buildTabs() {
  $('#tabs .in').innerHTML = TABS.map(t => `<button data-t="${t[0]}" class="${t[0] === tab ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${t[2]}</svg>${t[1]}</button>`).join('');
  $$('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; buildTabs(); render(); window.scrollTo(0, 0); });
  $('#tabs').classList.remove('hidden');
}
async function load(quiet) {
  try {
    H = await api('stHome');
    $('#hi').textContent = 'Group ' + H.group + ' · ' + H.subject; $('#who').textContent = H.name;
    $('#sub').textContent = 'Today is ' + dayName(H.today);
    buildTabs(); render();
  } catch (e) { if (KEY && !quiet) fail(e); if (!H && KEY) $('#view').innerHTML = `<div class="card"><p>Could not load. Check the internet.</p><button class="btn primary" onclick="load()">Try again</button></div>`; }
}
function mk(raw) { const v = String(raw); const n = +v.replace(',', '.'); return `<span class="mk ${v.toLowerCase() === 'nb' ? 'nb' : (isFinite(n) && n < 6 ? 'low' : '')}">${esc(v || '—')}</span>`; }
function render() { ({ home: tHome, marks: tMarks, lessons: tLessons, quizzes: tQuizzes })[tab](); $$('[data-join]').forEach(b => b.onclick = joinLive); }

function liveCard() {
  return H && H.live ? `<div class="card livecard"><div class="small" style="color:#fde68a;font-weight:800">● LIVE GAME NOW</div><div class="t" style="color:#fff;font-size:20px;font-weight:800;margin:4px 0">${esc(H.live.title)}</div>
    <p class="small" style="margin:0 0 12px;color:#cfe9df">Watch the screen in class and answer on your phone. Faster right answers get more points.</p><button class="btn block lvs-go" data-join>Join live game</button></div>` : '';
}
function quizBox() {
  const q = H.quiz; if (!q) return liveCard();
  const left = Math.max(0, Math.round((Date.parse(q.closes_at) - Date.parse(H.now)) / 60000));
  if (q.state === 'done') return `<div class="card quizcard"><div class="small muted">Quiz · done</div><div class="t">${esc(q.title)}</div><p style="margin:8px 0 0">Your mark: <b>${q.score10}</b> / 10. You will see the answers when your teacher closes the quiz.</p></div>`;
  return liveCard() + `<div class="card quizcard"><div class="small" style="color:var(--accent);font-weight:600">● Quiz is open now</div><div class="t">${esc(q.title)}</div>
    <p class="small muted" style="margin:4px 0 12px">${q.count} questions · about ${left} min left · one attempt</p>
    <button class="btn primary block" id="qgo">${q.state === 'working' ? 'Continue the quiz' : 'Start the quiz'}</button></div>`;
}
function tHome() {
  const dl = H.deadlines.slice(0, 4).map(d => `<li><div style="flex:1;min-width:0"><b>${esc(d.title)}</b><div class="small muted">${esc(d.due_date)} · ${esc(d.type)}${d.notes ? ' · ' + esc(d.notes) : ''}</div></div>
    ${d.days < 0 ? '<span class="pill gray">passed</span>' : d.days === 0 ? '<span class="pill bad">today</span>' : d.days <= 3 ? `<span class="pill warn">in ${d.days} d</span>` : `<span class="pill">in ${d.days} d</span>`}</li>`).join('');
  const hw = H.lessons.filter(l => l.homework).slice(-1)[0];
  $('#view').innerHTML = `${quizBox()}
    <div class="card"><div class="stats">
      <div class="stat"><b>${H.avg == null ? '—' : H.avg}</b><span>your average</span></div>
      <div class="stat"><b>${H.rank ? ord(H.rank) : '—'}</b><span>${H.rank ? 'of ' + H.ranked + ' in group' : 'place'}</span></div>
      <div class="stat"><b>${H.attended}/${H.marked}</b><span>lessons${H.nb ? ' · ' + H.nb + ' nb' : ''}</span></div></div>
      <p class="small muted" style="margin:10px 0 0">Group average: <b>${H.groupAvg == null ? '—' : H.groupAvg}</b>. Other students' names and marks are not shown.</p></div>
    ${hw ? `<div class="card"><h2>Latest homework</h2><div class="small muted">${esc(dayName(hw.date))}${hw.unit ? ' · ' + esc(hw.unit) : ''}${hw.topic ? ' · ' + esc(hw.topic) : ''}</div><p style="margin:6px 0 0">${esc(hw.homework)}</p></div>` : ''}
    <div class="card"><h2>Deadlines</h2>${dl ? `<ul class="list">${dl}</ul>` : '<p class="muted" style="margin:0">No deadlines now.</p>'}</div>
    <div class="card"><h2>Gradebook totals</h2><ul class="list">${H.totals.filter(t => t.value !== '').map(t => `<li><span style="flex:1">${esc(t.label)}</span><b>${esc(t.value)}</b><span class="small muted">/ ${t.max}</span></li>`).join('') || '<li class="muted">Nothing yet.</li>'}</ul></div>`;
  if ($('#qgo')) $('#qgo').onclick = () => startQuiz(H.quiz.quiz_id);
}
function chart(series) {
  const pts = series.filter(s => s.raw !== ''); if (pts.length < 2) return '';
  const W = Math.max(320, pts.length * 26), Ht = 150, L = 22, B = 22, T = 10;
  const x = i => L + 10 + i * ((W - L - 20) / Math.max(1, pts.length - 1)), y = v => T + (Ht - T - B) * (1 - v / 10);
  let path = '', grid = '';
  [0, 5, 10].forEach(v => grid += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${v}</text>`);
  pts.map((p, i) => [p, i]).filter(([p]) => p.val != null).forEach(([p, i], k) => path += (k ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.val).toFixed(1));
  const dots = pts.map((p, i) => p.val == null ? `<text x="${x(i)}" y="${y(0) + 3}" text-anchor="middle" style="fill:var(--bad);font-weight:700;font-size:12px">×</text>` : `<circle cx="${x(i)}" cy="${y(p.val)}" r="3.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>`).join('');
  return `<div class="card"><h2>My marks</h2><div style="overflow-x:auto"><svg width="${W}" height="${Ht}" role="img" aria-label="Marks chart">${grid}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}</svg></div><div class="small muted">× = absent (nb)</div></div>`;
}
function tMarks() {
  const rows = H.series.slice().reverse();
  $('#view').innerHTML = `${chart(H.series)}<div class="card"><h2>Daily marks</h2><ul class="list">${rows.map(s => `<li><span style="flex:1">${esc(dayName(s.date))}</span>${s.raw === '' ? '<span class="small muted">no mark</span>' : mk(s.raw)}</li>`).join('') || '<li class="muted">No marks yet.</li>'}</ul></div>`;
}
function tLessons() {
  const ls2 = H.lessons.slice().reverse();
  $('#view').innerHTML = `<div class="card"><h2>Lessons & homework</h2>${ls2.length ? `<ul class="list">${ls2.map(l => `<li style="align-items:flex-start"><div style="min-width:74px"><b>${esc(l.date)}</b><div class="small muted">${esc(dayName(l.date).split(' ')[0])}</div></div>
    <div style="flex:1;min-width:0">${l.unit ? `<span class="pill">${esc(l.unit)}</span> ` : ''}<b>${esc(l.topic)}</b>${l.homework ? `<div class="small" style="margin-top:4px"><span class="muted">Homework:</span> ${esc(l.homework)}</div>` : ''}</div></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Nothing yet.</p>'}</div>`;
}

      <div class="lvs-q">${esc(q.prompt)}</div>
      <div class="lvs-opts">${q.options.map((o, k) => `<button class="lvs-opt ${SL.sent ? (SL.sent.a === k ? 'pick' : 'dim') : ''}" data-k="${k}" style="background:${LCOL[k]}" ${SL.sent || SL.late ? 'disabled' : ''}><span class="sh">${LSH[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      ${SL.sent ? '<div class="lvs-card">Answer sent ✓<br><span class="lvs-dim">Wait for the others.</span></div>' : SL.late ? '<div class="lvs-card">Too late for this question.</div>' : ''}`);
    $$('[data-k]', el).forEach(b => b.onclick = () => slAnswer(+b.dataset.k));
    const upd = () => { const t = $('#slt'); if (!t) return; t.textContent = Math.max(0, Math.ceil((st.startedAt + st.dur * 1000 - SL.fb.now()) / 1000)); };
    upd(); SL.tick = setInterval(upd, 250);
    return;
  }
  if (st.phase === 'reveal' || st.phase === 'board') {
    if (!SL.rev[st.q]) {
      el.innerHTML = slBox('<div class="lvs-big">Time is up!</div>');
      if (SL.revRef) SL.revRef.off();
      SL.revRef = SL.g.child('reveal/' + st.q);
      SL.revRef.on('value', x => { if (x.val()) { SL.rev[st.q] = x.val(); SL.revRef.off(); slRender(); } });
      return;
    }
    const rv = SL.rev[st.q], q = SL.qi === st.q ? SL.qd : (await SL.g.child('questions/' + st.q).once('value')).val();
    if (my !== SL.rt) return;
    const mine = (SL.qi === st.q && SL.sent) || (SL.my && SL.my.answered);
    const ok = !!(SL.my && SL.my.lastOk);
    const right = q ? `${LSH[rv.correct]} ${esc(q.options[rv.correct])}` : '';
    el.innerHTML = slBox(`<div class="lvs-top"><span class="lvs-dim">Question ${st.q + 1}${q ? ' of ' + q.total : ''}</span></div>
      ${!mine ? `<div class="lvs-res na">No answer<small>Right answer: ${right}</small></div>` : ok ? `<div class="lvs-res ok">✓ Correct<small>+${(SL.my.last || 0).toLocaleString('en-US')} points</small></div>` : `<div class="lvs-res no">✗ Wrong<small>Right answer: ${right}</small></div>`}
      ${slRank()}${st.phase === 'board' ? '<p class="lvs-dim" style="text-align:center">Look at the screen for the top 5.</p>' : ''}`);
    return;
  }
  if (st.phase === 'end') {
    el.innerHTML = slBox(`<div class="lvs-big" style="margin-top:12vh">Game over!</div>${slRank()}
      ${SL.my && SL.my.rank ? `<div class="lvs-card">You got <b>${SL.my.right || 0} of ${SL.n}</b> right. ${SL.j.guest ? 'You played as a guest, so there is no mark in the gradebook.' : 'Your mark goes to the gradebook.'}</div>` : ''}
      <button class="btn block lvs-go" onclick="leaveLive()">${KEY ? 'Back to my page' : 'Close'}</button>`);
  }
}
/* ---- Robot Run on the phone: all questions at your own speed ---- */
function slSeedShuffle(arr, seed) {
  let h = 2166136261; for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const r = () => { h = (h + 0x6D2B79F5) | 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
function slRaceShow() {
  if (!SL || !SL.rq) return;
  const el = $('#live'), st = SL.state, N = SL.rq.length, i = SL.rorder.find(x => !SL.rdone[x]);
  clearInterval(SL.tick);
  if (i === undefined) {
    el.innerHTML = slBox(`<div class="lvs-big" style="margin-top:14vh">🏁 You finished!</div><div id="slrs"></div><p class="lvs-dim" style="text-align:center">Wait for the others. Look at the screen.</p>`);
    slRaceStatus(); return;
  }
  const q = SL.rq[i];
  el.innerHTML = slBox(`<div class="lvs-top"><span class="lvs-dim">🤖 Robot Run · question ${Object.keys(SL.rdone).length + 1} of ${N}</span><span class="lvs-timer" id="slt">--:--</span></div>
    <div id="slrs"></div><div class="lvs-q">${esc(q.prompt)}</div>
    <div class="lvs-opts">${q.options.map((o, k) => `<button class="lvs-opt" data-k="${k}" style="background:${LCOL[k]}"><span class="sh">${LSH[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`);
  $$('[data-k]', el).forEach(b => b.onclick = () => slRaceAnswer(i, +b.dataset.k));
  slRaceStatus();
  const upd = () => { const t = $('#slt'); if (!t || !st) return; const sec = Math.max(0, Math.ceil((st.startedAt + st.dur * 1000 - SL.fb.now()) / 1000)); t.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  upd(); SL.tick = setInterval(upd, 500);
}
function slRaceAnswer(i, k) {
  if (!SL || SL.rdone[i] || !SL.state || SL.state.phase !== 'race') return;
  SL.rdone[i] = 1;
  SL.g.child(`race/${SL.fb.uid}/${i}`).set({ a: k, t: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
  slRaceShow();   // next question at once; the ✓/✗ arrives from the teacher's screen a moment later
}
function slRaceStatus() {
  const b = $('#slrs'); if (!b || !SL) return;
  const p = SL.prog || {}, v = SL.verd || {};
  const marks = Object.keys(v).filter(k => v[k] != null).map(k => v[k] ? '<span style="color:#86efac">✓</span>' : '<span style="color:#fca5a5">✗</span>').join(' ');
  b.innerHTML = `<div class="lvs-card" style="padding:10px 12px;font-size:16px;${p.caught ? 'background:rgba(226,27,60,.55)' : ''}">${p.caught ? '🤖 The robot caught you! Answer right to escape!' : p.rank ? `🏃 ${ord(p.rank)} place · ${p.right || 0} right` : '🏃 Run! Every right answer is one step.'}
    ${marks ? `<div style="margin-top:6px;letter-spacing:2px;font-size:18px">${marks}</div>` : ''}</div>`;
}
async function slAnswer(k) {
  if (!SL || SL.sent || !SL.state || SL.state.phase !== 'question') return;
  const qi = SL.state.q; SL.sent = { a: k }; slRender();
  try { await SL.g.child(`answers/${qi}/${SL.fb.uid}`).set({ a: k, t: firebase.database.ServerValue.TIMESTAMP }); }
  catch (e) { if (SL && SL.qi === qi) { SL.sent = null; SL.late = true; slRender(); } }
}

if (PREVIEW) startPreview(); else if (PLAY) joinLive(PLAY); else if (KEY) { load(); startPing(); } else noAccess();
</script>
