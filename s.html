<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My lessons · Darslar</title>
<meta name="theme-color" content="#0b7a5f">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7a5f'/%3E%3Cpath d='M18 16h14a16 16 0 0 1 0 32H18z' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --panel:#fff; --ink:#14201c; --muted:#5d6d67; --line:#e2e8e5; --soft:#f7faf9;
  --accent:#0b7a5f; --accent-2:#10a37f; --accent-ink:#fff; --accent-soft:#e3f4ee; --head:#0d2b23;
  --good:#16865a; --good-soft:#e3f4ee; --warn:#b26a00; --warn-soft:#fff3dd; --bad:#c43a3a; --bad-soft:#fdeceb; --ro:#f1f4f3;
  --r:16px; --tap:48px; --shadow:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1513; --panel:#151f1c; --ink:#e4efeb; --muted:#93a8a0; --line:#24332e; --soft:#1a2622;
    --accent:#34c79c; --accent-2:#5fd8b2; --accent-ink:#06231a; --accent-soft:#173a30; --head:#0a1210;
    --good:#4ccf94; --good-soft:#173a30; --warn:#e6a940; --warn-soft:#3a2d14; --bad:#ff7b7b; --bad-soft:#3b1f1f; --ro:#1b2622; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* ---- live game (student) ---- */
#live{min-height:100vh;background:#0e3b2e;color:#fff;padding:14px 16px 40px}
.lvs{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.lvs-big{font-size:26px;font-weight:800;text-align:center;margin-top:22vh;line-height:1.25}
.lvs-h{font-size:24px;margin:0;color:#fff}
.lvs-dim{color:#a9cfc1}
#live input{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:12px;border:0;color:#111;background:#fff}
.lvs-go{background:#fff!important;color:#0e3b2e!important;font-weight:800!important;font-size:20px!important;padding:14px!important;border:0!important}
.lvs-q{background:#fff;color:#111;border-radius:14px;padding:16px;font-size:20px;font-weight:700;line-height:1.3}
.lvs-opts{display:grid;gap:10px}
.lvs-opt{display:flex;align-items:center;gap:12px;border:0;border-radius:12px;padding:14px 16px;min-height:62px;color:#fff;font:inherit;font-size:18px;font-weight:700;text-align:left;cursor:pointer;width:100%}
.lvs-opt .sh{font-size:24px;width:28px;text-align:center;flex:none}
.lvs-opt.dim{opacity:.3}.lvs-opt.pick{box-shadow:0 0 0 4px #fff}
.lvs-opt:disabled{cursor:default}
.lvs-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvs-timer{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 14px;font-weight:800;font-size:20px;min-width:56px;text-align:center}
.lvs-res{border-radius:16px;padding:24px 16px;text-align:center;font-size:30px;font-weight:800}
.lvs-res small{display:block;font-size:17px;font-weight:600;margin-top:6px}
.lvs-res.ok{background:#26890c}.lvs-res.no{background:#e21b3c}.lvs-res.na{background:#4b5563}
.lvs-card{background:rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center;font-size:18px}
.lvs-card b{font-size:30px;display:block}
.livecard{background:linear-gradient(135deg,#0e3b2e,#17694f)!important;color:#fff;border:0!important}
#live .btn:not(.lvs-go){background:rgba(255,255,255,.14);color:#fff;border:0}
.lvs-avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lvs-avs button{font-size:30px;line-height:1;padding:8px 0;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.1);cursor:pointer}
.lvs-avs button.on{border-color:#fff;background:rgba(255,255,255,.3)}
.lvs-react{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.lvs-react button{font-size:28px;line-height:1;padding:8px 10px;border-radius:12px;border:0;background:rgba(255,255,255,.1);cursor:pointer;transition:transform .15s}
.lvs-react button:active,.lvs-react button.sent{transform:scale(1.3)}
.lvs-react button:disabled{opacity:.45}
.lvs-team{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:800;font-size:15px;color:#fff}
.lvs-conf{display:grid;gap:10px}
.lvs-conf button{border:0;border-radius:12px;padding:14px 16px;font:inherit;font-size:19px;font-weight:800;color:#0e3b2e;background:#fff;cursor:pointer;text-align:left}
.lvs-conf button small{display:block;font-weight:600;font-size:14px;color:#4b5563}
.lvs-crew{position:relative;height:36px;background:rgba(0,0,0,.35);border-radius:18px;overflow:hidden;margin:8px 0 4px}
.lvs-crew i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(38,137,12,.2),rgba(38,137,12,.7));transition:width .4s}
.lvs-crew span{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:24px;line-height:1;transition:left .4s}
.lvs-crew .me{z-index:2} .lvs-crew .bot{z-index:3;margin-left:-14px;filter:drop-shadow(0 0 4px #e21b3c)} .lvs-crew .door{right:2px;left:auto;transform:translateY(-50%)}
.lvs-boost{display:block;width:100%;min-height:58px;border:0;border-radius:14px;background:linear-gradient(90deg,#f59e0b,#facc15);color:#1f2937;font:inherit;font-size:19px;font-weight:900;cursor:pointer;animation:lvsglow 1s ease-in-out infinite alternate;touch-action:manipulation}
@keyframes lvsglow{from{box-shadow:0 0 0 rgba(250,204,21,.0)}to{box-shadow:0 0 22px rgba(250,204,21,.85)}}
.lvs-zbar{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden} .lvs-zbar i{display:block;height:100%;width:100%;background:#1368ce;transition:width .2s linear}
.lvs-map{position:relative;aspect-ratio:10/6;width:100%;background-color:#16203a;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:10% 16.6667%;border-radius:12px;border:2px solid rgba(255,255,255,.2);overflow:hidden;touch-action:manipulation;cursor:pointer}
.lvs-z{position:absolute;background:rgba(38,137,12,.45);border:2px solid #4ade80;border-radius:8px;display:flex;justify-content:space-between;align-items:flex-start;padding:1px 4px;font-weight:900;font-size:12px;box-sizing:border-box;pointer-events:none}
.lvs-z.full{border-color:#facc15;background:rgba(216,158,0,.4)} .lvs-z.over{background:rgba(226,27,60,.55);border-color:#f87171}
.lvs-me{position:absolute;transform:translate(-50%,-50%);font-size:clamp(20px,6vw,30px);line-height:1;filter:drop-shadow(0 0 5px #fff);z-index:3;pointer-events:none;transition:left .12s,top .12s}
.lvs-tgt{position:absolute;width:14px;height:14px;border:3px solid #fde68a;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.lvs-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;width:100%}
.lvs-pad button{height:62px;border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-size:26px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.lvs-pad button:active{background:rgba(255,255,255,.4)} .lvs-pad [data-d="0,-1"]{grid-column:2;grid-row:1} .lvs-pad [data-d="-1,0"]{grid-column:1;grid-row:2} .lvs-pad [data-d="0,1"]{grid-column:2;grid-row:2} .lvs-pad [data-d="1,0"]{grid-column:3;grid-row:2}
.lvs-mbar{position:relative;height:44px;background:rgba(0,0,0,.3);border-radius:22px;overflow:hidden;margin-top:8px}
.lvs-mbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6d28d9,#26890c)}
.lvs-mbar span{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);font-size:28px}
.lvs-fb{display:flex;flex-direction:column;gap:10px;text-align:left}
.lvs-fb .row2{display:flex;gap:8px;justify-content:center}
.lvs-fb button{font:inherit;font-size:26px;line-height:1;padding:8px 12px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.lvs-fb button.on{border-color:#fde68a;background:rgba(253,230,138,.25)}
.lvs-fb .txt{font-size:16px;padding:10px 16px}

header{background:var(--head);color:#fff;padding:18px 16px 54px}
header .in,.wrap{max-width:640px;margin:0 auto}
header .hi{font-size:13px;color:#9cc3b5}
header h1{margin:2px 0 0;font-size:21px;line-height:1.25}
header .sub{font-size:13px;color:#9cc3b5;margin-top:2px}
.wrap{padding:0 16px calc(96px + env(safe-area-inset-bottom));margin-top:-40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--ro);color:var(--muted)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 18px;min-height:var(--tap);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.mk{min-width:44px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.mk.nb{background:var(--bad-soft);color:var(--bad)} .mk.low{background:var(--warn-soft);color:var(--warn)}
.quizcard{border:2px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%)}
.quizcard .t{font-size:18px;font-weight:700}
.big{font-size:40px;font-weight:700;line-height:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:90;max-width:92vw}
.toast.err{background:var(--bad);color:#fff}
/* quiz */
.qtop{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:12px 16px}
.qtop .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:10px}
.timer.low{background:var(--bad);color:#fff}
.qprog{height:4px;background:rgba(255,255,255,.15)} .qprog i{display:block;height:100%;background:var(--accent-2);transition:width .2s}
.qwrap{max-width:640px;margin:0 auto;padding:14px 16px 120px}
.q .n{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.q .p{font-weight:600;font-size:17px;margin:4px 0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;min-height:var(--tap);margin-bottom:8px;cursor:pointer}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)} .opt.on .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input.gap{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;min-height:var(--tap)}
input.gap:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;margin-bottom:8px}
.mrow .l{font-weight:500}
select{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;min-height:var(--tap)}
.ord{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px;background:var(--panel)}
.ord .tx{flex:1;min-width:0}
.ord button{width:40px;height:40px;border:1px solid var(--line);background:var(--soft);border-radius:10px;cursor:pointer;font-size:16px}
.qbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.qbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.rv{padding:10px 0;border-bottom:1px solid var(--line)} .rv:last-child{border-bottom:0}
.pvbar{background:#fef3c7;color:#92400e;padding:8px 14px;font-size:13px;text-align:center;font-weight:600}
.rv .y{color:var(--bad)} .rv.ok .y{color:var(--good)} .rv .r{color:var(--good)}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
</style>
</head>
<body>
<div id="main">
  <header><div class="in"><div class="hi" id="hi">Darslar</div><h1 id="who">Loading…</h1><div class="sub" id="sub"></div></div></header>
  <div class="wrap" id="view"><div class="card loading">Loading…</div></div>
  <nav class="tabs hidden" id="tabs"><div class="in"></div></nav>
</div>
<div id="quiz" class="hidden"></div>
<div id="live" class="hidden"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzP51ZVzUqdzT-iV_Un8g82e7SvX-iSIDm2Qm1oz05AkdDPkWnNw0Yk_C9JCf6HEvqH/exec';

/* Requests go through the Cloudflare Worker (faster, retries when Google is busy).
   If the Worker cannot be reached, the page talks to Apps Script directly. */
const API_CF = 'https://darslar-api.vtangriyev.workers.dev';
let viaCF = (() => { try { return sessionStorage.getItem('dp_nocf') !== '1'; } catch (e) { return true; } })();
async function apiFetch(body) {
  if (viaCF) {
    try { const r = await fetch(API_CF, { method: 'POST', body }); if (r.ok) return r; }
    catch (e) {}
    viaCF = false; try { sessionStorage.setItem('dp_nocf', '1'); } catch (x) {}
  }
  return fetch(API, { method: 'POST', body });
}
const $ = (q, el) => (el || document).querySelector(q), $$ = (q, el) => Array.from((el || document).querySelectorAll(q));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function toast(m, err) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2600); }
const fail = e => toast((e && e.message) || String(e), true);
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function md(s) { s = String(s == null ? '' : s).trim(); const m = /^(\d{1,2})\.(\d{1,2})(?:\.\d{2,4})?$/.exec(s); return m && +m[2] >= 1 && +m[2] <= 12 ? MONS[+m[2] - 1] + ' ' + (+m[1]) : s; }
function ddk(s) { const m = /^(\d{2})\.(\d{2})$/.exec(s || ''); if (!m) return 0; let mo = +m[2]; if (mo < 8) mo += 12; return mo * 100 + (+m[1]); }
function dayName(ddmm) { const now = new Date(); const [d, m] = ddmm.split('.').map(Number); let y = now.getFullYear(); if (now.getMonth() >= 7 && m < 8) y++; if (now.getMonth() < 7 && m >= 8) y--; return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }

let KEY = null;
const m = /k=([a-f0-9]{40})/.exec(location.hash);
if (m) { KEY = m[1]; ls.set('ds_k', KEY); } else KEY = ls.get('ds_k');
// Teacher "Student view": s.html#preview=<quiz_id>, opened from the teacher site (uses the teacher key, writes nothing)
const PLm = /play=([a-f0-9]{16,64})/.exec(location.hash);
const PLAY = PLm ? PLm[1] : null;   // opened from the QR code on the projector
const PVm = /preview=([^&]+)/.exec(location.hash);
const PREVIEW = PVm ? decodeURIComponent(PVm[1]) : null;
if (PREVIEW) {
  KEY = null;
  try { if (parent !== window && parent.dpKey) KEY = parent.dpKey(); } catch (e) {}
  if (!KEY) { try { KEY = localStorage.getItem('dp_key') || sessionStorage.getItem('dp_key'); } catch (e) {} }
}

async function api(action, ...args) {
  const r = await apiFetch(JSON.stringify({ action, key: KEY, args }));
  if (!r.ok) throw new Error('Server error ' + r.status + '. Try again.');
  const j = await r.json();
  if (!j.ok) { if (j.error === 'LINK_INVALID') { noAccess(); throw new Error('This link no longer works.'); } throw new Error(j.error); }
  return j.data;
}
function noAccess() {
  try { Object.keys(localStorage).filter(k => k.startsWith('ds_home_')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  sigClose();
  $('#who').textContent = 'Personal link needed'; $('#sub').textContent = ''; $('#tabs').classList.add('hidden');
  $('#view').innerHTML = `<div class="card"><h2>Open your page from Telegram</h2><p class="muted">Open the student bot of your teacher and send <b>/link</b>. You will get your personal link. If you are new, send <b>/start</b> and choose your name.</p></div>`;
}

const TABS = [['home', 'Home', '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'], ['marks', 'Marks', '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ['lessons', 'Lessons', '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>'], ['quizzes', 'Quizzes', '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>']];
let H = null, tab = 'home', pingT = null;
function buildTabs() {
  $('#tabs .in').innerHTML = TABS.map(t => `<button data-t="${t[0]}" class="${t[0] === tab ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${t[2]}</svg>${t[1]}</button>`).join('');
  $$('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; buildTabs(); render(); window.scrollTo(0, 0); });
  $('#tabs').classList.remove('hidden');
}
function showHome(h) {
  H = h;
  $('#hi').textContent = 'Group ' + H.group + ' · ' + H.subject; $('#who').textContent = H.name;
  $('#sub').textContent = 'Today is ' + dayName(H.today);
  buildTabs(); render();

async function load(quiet) {
